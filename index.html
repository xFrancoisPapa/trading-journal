<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Trading Journal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="theme-color" content="#171310" />
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root {
  --bg:#171310; --surface:#1F1A15; --surface-2:#2A241D; --border:#3A322A;
  --text:#F2E9DC; --text-dim:#A89A85; --text-faint:#6E6255;
  --gold:#C9A227; --profit:#4FA88A; --profit-bg:rgba(79,168,138,0.14);
  --loss:#C1584A; --loss-bg:rgba(193,88,74,0.14);
  --radius:10px;
}
[data-theme="light"] {
  --bg:#F7F2E8; --surface:#FFFFFF; --surface-2:#F1E9D8; --border:#E1D3B4;
  --text:#2B2419; --text-dim:#6B5D46; --text-faint:#8F8064;
  --gold:#A9790F; --profit:#2E7D5B; --profit-bg:rgba(46,125,91,0.10);
  --loss:#B23D30; --loss-bg:rgba(178,61,48,0.10);
}
html,body{margin:0;padding:0;background:var(--bg);transition:background .2s;}
.tj-app {
  background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
  min-height:100vh; box-sizing:border-box;
}
.tj-app *{box-sizing:border-box;}
.tj-app .num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
.tj-app .profit{color:var(--profit);} .tj-app .loss{color:var(--loss);}
.tj-muted{color:var(--text-dim);font-size:13px;}
.tj-loading{display:flex;align-items:center;justify-content:center;gap:10px;height:60vh;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;font-size:13px;}
.tj-spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:tj-spin .8s linear infinite;}
@keyframes tj-spin{to{transform:rotate(360deg);}}
.tj-shell{display:flex;min-height:100vh;}
.tj-sidebar{width:242px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.tj-sidebar-top{display:flex;flex-direction:column;gap:12px;margin-bottom:20px;}
.tj-sidebar-brand{display:flex;align-items:center;gap:9px;padding:0 6px;}
.tj-sidebar-brand-text{font-family:'Fraunces',serif;font-weight:600;font-size:15.5px;letter-spacing:-.01em;}
.tj-sidebar-nav{display:flex;flex-direction:column;gap:3px;}
.tj-sidebar-item{display:flex;align-items:center;gap:11px;background:none;border:none;color:var(--text-dim);font-size:13.5px;font-weight:500;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left;width:100%;transition:background .15s ease,color .15s ease;}
.tj-sidebar-icon{font-size:15px;opacity:.85;}
.tj-sidebar-item:hover{background:var(--surface-2);color:var(--text);}
.tj-sidebar-item.active{background:rgba(201,162,39,.14);color:var(--gold);box-shadow:inset 2px 0 0 var(--gold);}
.tj-sidebar-item.active .tj-sidebar-icon{opacity:1;}
.tj-sidebar-customize{background:none;border:none;color:var(--text-faint);font-size:12px;text-align:left;padding:9px 12px;cursor:pointer;margin-top:8px;border-radius:8px;transition:color .15s ease,background .15s ease;}
.tj-sidebar-customize:hover{color:var(--text-dim);background:var(--surface-2);}
.tj-sidebar-bottom{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding-top:16px;border-top:1px solid var(--border);}
.tj-sidebar-utility{display:flex;align-items:center;justify-content:space-between;padding:0 2px;}
.tj-content{flex:1;min-width:0;padding:24px 28px 60px;}
.tj-content-topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
.tj-content-topbar h1{font-family:'Fraunces',serif;font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em;}
.tj-mobile-topbar{display:none;}
.tj-mobile-bottomnav{display:none;}
.tj-mobile-profile-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--surface-2);overflow:hidden;padding:0;flex-shrink:0;}
.tj-mobile-profile-btn img{width:100%;height:100%;object-fit:cover;}
@media (max-width:820px){
  .tj-shell{flex-direction:column;}
  .tj-sidebar{display:none;}
  .tj-mobile-topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:35;}
  .tj-mobile-topbar .tj-brand-mark{font-size:22px;flex-shrink:0;}
  .tj-mobile-topbar .tj-account-switcher{flex:1;min-width:0;}
  .tj-mobile-bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);z-index:35;padding-bottom:env(safe-area-inset-bottom);}
  .tj-bottomnav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 10px;background:none;border:none;color:var(--text-faint);font-size:9.5px;font-weight:500;cursor:pointer;}
  .tj-bottomnav-item.active{color:var(--gold);}
  .tj-bottomnav-icon{font-size:19px;line-height:1;}
  .tj-bottomnav-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:64px;}
  .tj-content{padding:16px 16px 90px;}
}
.tj-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;margin-bottom:18px;}
.tj-brand{display:flex;align-items:center;gap:12px;}
.tj-brand-mark{font-family:'Fraunces',serif;font-size:30px;color:var(--gold);line-height:1;}
.tj-brand h1{font-family:'Fraunces',serif;font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em;}
.tj-brand p{margin:2px 0 0;font-size:12px;color:var(--text-faint);font-style:italic;}
.tj-header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.tj-saved{font-size:11px;color:var(--profit);font-family:'IBM Plex Mono',monospace;opacity:0;transition:opacity .3s;}
.tj-saved.show{opacity:1;}
.tj-btn{font-family:'Inter',sans-serif;font-size:13px;font-weight:500;padding:8px 14px;border-radius:7px;border:1px solid var(--border);cursor:pointer;transition:all .15s;background:var(--surface);color:var(--text);display:inline-flex;align-items:center;gap:6px;}
.tj-btn:hover{border-color:var(--gold);}
.tj-btn:disabled{opacity:.4;cursor:not-allowed;}
.tj-btn-primary{background:var(--gold);border-color:var(--gold);color:#1A1611;font-weight:600;}
.tj-btn-primary:hover{filter:brightness(1.08);}
.tj-btn-ghost{background:transparent;}
.tj-btn-danger{background:transparent;border-color:var(--loss);color:var(--loss);}
.tj-btn-danger:hover{background:var(--loss-bg);}
.tj-tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px;overflow-x:auto;}
.tj-tab{background:none;border:none;color:var(--text-dim);font-size:13px;font-weight:500;padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
.tj-tab:hover{color:var(--text);}
.tj-tab.active{color:var(--gold);border-bottom-color:var(--gold);}
.tj-empty{text-align:center;padding:70px 20px;color:var(--text-dim);}
.tj-empty.small{padding:40px 20px;}
.tj-empty-mark{font-family:'Fraunces',serif;font-size:40px;color:var(--gold);display:block;margin-bottom:6px;}
.tj-empty h2{font-family:'Fraunces',serif;color:var(--text);margin:0 0 8px;}
.tj-empty p{font-size:13px;margin:0 auto 18px;max-width:440px;}
.tj-stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px;}
.tj-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:4px;box-shadow:0 1px 2px rgba(0,0,0,.12);transition:transform .15s ease,box-shadow .15s ease;}
.tj-stat:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,0,0,.18);}
.tj-stat.big{grid-column:span 2;}
.tj-stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);}
.tj-stat-value{font-size:20px;font-weight:500;}
.tj-stat.big .tj-stat-value{font-size:28px;}
.tj-stat-sub{font-size:11px;color:var(--text-dim);}
.tj-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.1);}
.tj-panel h3{font-family:'Fraunces',serif;font-weight:600;margin:0 0 12px;font-size:16px;}
.tj-ledger-lines{background-image:repeating-linear-gradient(180deg,transparent,transparent 27px,rgba(201,162,39,.05) 28px);}
.tj-chart-wrap{overflow-x:auto;}
.tj-chart-svg{width:100%;display:block;cursor:crosshair;}
.tj-chart-axis-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;fill:var(--text-faint);}
.tj-chart-grid{stroke:var(--border);stroke-width:1;opacity:0.6;}
.tj-chart-zero{stroke:var(--text-faint);stroke-width:1;stroke-dasharray:3 3;}
.tj-chart-cursor{stroke:var(--gold);stroke-width:1;opacity:0.5;}
.tj-chart-tooltip{position:absolute;top:6px;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--gold);border-radius:8px;padding:7px 11px;font-size:12px;white-space:nowrap;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.35);z-index:5;}
.tj-chart-tooltip-date{color:var(--text-faint);font-family:'IBM Plex Mono',monospace;font-size:10px;margin-bottom:2px;}
.tj-calendar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
.tj-cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.tj-cal-title{text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;}
.tj-cal-title h3{font-family:'Fraunces',serif;margin:0;font-size:17px;}
.tj-cal-week{display:grid;grid-template-columns:repeat(7,1fr) 78px;gap:6px;margin-bottom:6px;}
.tj-cal-weekhead .tj-cal-wd:last-child{font-weight:600;color:var(--gold);}
.tj-cal-wd{text-align:center;font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;}
.tj-cal-cell{aspect-ratio:1;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:4px;color:var(--text);position:relative;}
.tj-cal-cell:disabled{cursor:default;opacity:.55;}
.tj-cal-cell.empty{background:transparent;border:none;}
.tj-cal-cell.profit{background:var(--profit-bg);border-color:rgba(79,168,138,.35);}
.tj-cal-cell.loss{background:var(--loss-bg);border-color:rgba(193,88,74,.35);}
.tj-cal-cell.today{box-shadow:0 0 0 1.5px var(--gold) inset;}
.tj-cal-daynum{font-size:11px;color:var(--text-faint);}
.tj-cal-pnl{font-size:11px;}
.tj-cal-count{font-size:9px;color:var(--text-faint);}
.tj-cal-journal-dot{position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--gold);}
.tj-week-total{display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px dashed var(--border);font-size:12px;background:var(--surface-2);}
.tj-week-total.profit{background:var(--profit-bg);border-color:rgba(79,168,138,.35);}
.tj-week-total.loss{background:var(--loss-bg);border-color:rgba(193,88,74,.35);}
.tj-log-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.tj-input{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:8px 10px;font-size:13px;font-family:'Inter',sans-serif;}
.tj-input:focus{outline:none;border-color:var(--gold);}
.tj-day-filter{display:flex;gap:10px;align-items:center;margin-bottom:12px;font-size:13px;color:var(--text-dim);}
.tj-link{background:none;border:none;color:var(--gold);cursor:pointer;font-size:12px;text-decoration:underline;padding:0;}
.tj-table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);}
.tj-table{width:100%;border-collapse:collapse;font-size:13px;min-width:920px;}
.tj-table th{text-align:left;padding:10px 12px;color:var(--text-faint);font-size:11px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap;}
.tj-table th.sorted{color:var(--gold);}
.tj-table td{padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
.tj-table tr:last-child td{border-bottom:none;}
.tj-table tr:hover td{background:rgba(255,255,255,.02);}
.tj-symbol{font-weight:600;font-family:'IBM Plex Mono',monospace;}
.tj-dir{font-size:11px;padding:2px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em;}
.tj-dir.long{background:rgba(110,155,193,.15);color:#6E9BC1;}
.tj-dir.short{background:rgba(155,127,199,.15);color:#9B7FC7;}
.tj-dir.watching{background:var(--surface-2);color:var(--text-dim);}
.tj-tag-pill{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);display:inline-flex;align-items:center;gap:4px;}
.tj-notes{max-width:170px;overflow:hidden;text-overflow:ellipsis;color:var(--text-dim);font-size:12px;}
.tj-row-actions{display:flex;gap:4px;}
.tj-icon-btn{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:13px;padding:4px 6px;border-radius:5px;}
.tj-icon-btn:hover{color:var(--text);background:var(--surface-2);}
.tj-password-wrap{position:relative;width:100%;}
.tj-password-wrap .tj-input{width:100%;padding-right:38px;}
.tj-password-toggle{position:absolute;top:50%;right:2px;transform:translateY(-50%);background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:15px;padding:6px 8px;line-height:1;}
.tj-password-toggle:hover{color:var(--text);}
.tj-tags-view{display:flex;flex-direction:column;gap:0;}
.tj-tag-add{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
.tj-swatches{display:flex;gap:6px;flex-wrap:wrap;max-width:260px;}
.tj-swatch{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer;}
.tj-swatch.active{border-color:var(--text);}
.tj-icon-picker{display:flex;gap:4px;flex-wrap:wrap;max-width:280px;}
.tj-icon-opt{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:var(--surface-2);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
.tj-icon-opt.active{border-color:var(--gold);background:rgba(201,162,39,.15);}
.tj-tag-table{display:flex;flex-direction:column;gap:2px;margin-top:10px;}
.tj-tag-row{display:grid;grid-template-columns:24px 1fr auto auto auto auto;gap:12px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--border);font-size:13px;}
.tj-tag-row:last-child{border-bottom:none;}
.tj-tag-dot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;}
.tj-tag-name{font-weight:500;}
.tj-data-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.tj-danger-zone{border-top:1px dashed var(--border);padding-top:14px;}
.tj-confirm-reset{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--text-dim);}
.tj-inst-table{display:flex;flex-direction:column;}
.tj-inst-row{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 70px;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--border);font-size:13px;}
.tj-inst-row.tj-inst-head{color:var(--text-faint);font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
.tj-inst-input{width:100%;padding:6px 8px;font-size:12px;}
.tj-inst-actions{display:flex;gap:6px;justify-content:flex-end;}
.tj-inst-add{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center;}
.tj-checklist-manager{display:flex;flex-direction:column;gap:6px;}
.tj-checklist-item{display:flex;gap:8px;align-items:center;}
.tj-checklist-icons{display:flex;gap:3px;font-family:'IBM Plex Mono',monospace;font-size:13px;}
.tj-check-glyph{width:16px;height:16px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;background:var(--surface-2);color:var(--text-faint);}
.tj-check-glyph.pass{background:var(--profit-bg);color:var(--profit);}
.tj-check-glyph.fail{background:var(--loss-bg);color:var(--loss);}
.tj-checklist-edit{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.tj-checklist-row{display:flex;align-items:center;gap:10px;background:var(--surface-2);padding:8px 10px;border-radius:8px;}
.tj-checklist-row span{flex:1;font-size:13px;}
.tj-check-toggle{display:flex;gap:6px;}
.tj-check-btn{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--text-faint);cursor:pointer;font-size:14px;}
.tj-check-btn.pass.active{background:var(--profit-bg);border-color:var(--profit);color:var(--profit);}
.tj-check-btn.fail.active{background:var(--loss-bg);border-color:var(--loss);color:var(--loss);}
.tj-attach-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.tj-attach-thumb{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--border);background:var(--surface-2);}
.tj-attach-thumb img{width:100%;height:100%;object-fit:cover;}
.tj-attach-doc{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;font-size:9px;color:var(--text-dim);text-align:center;padding:2px;gap:2px;}
.tj-attach-remove{position:absolute;top:2px;right:2px;background:rgba(10,8,6,.75);border:none;color:var(--text);border-radius:50%;width:16px;height:16px;font-size:10px;cursor:pointer;line-height:1;}
.tj-attach-badge{font-size:11px;color:var(--text-dim);}
.tj-plan-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.tj-view-toggles{display:flex;gap:8px;flex-wrap:wrap;}
.tj-toggle-chip{background:var(--surface-2);border:1px solid var(--border);color:var(--text-faint);font-size:12.5px;font-weight:500;padding:7px 13px;border-radius:20px;cursor:pointer;transition:all .15s ease;}
.tj-toggle-chip:hover{border-color:var(--gold);color:var(--text-dim);}
.tj-toggle-chip.on{background:rgba(201,162,39,.14);border-color:var(--gold);color:var(--gold);}
.tj-section-title{margin:0 0 12px;font-family:'Fraunces',serif;font-size:16px;font-weight:600;}
.tj-referral-counts{display:flex;gap:24px;margin-top:10px;flex-wrap:wrap;}
.tj-referral-counts > div{display:flex;flex-direction:column;gap:2px;}
.tj-referral-num{font-size:22px;font-weight:500;}
.tj-referral-plan-breakdown{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.tj-setup-footer{text-align:center;padding:24px 0 8px;font-size:12px;color:var(--text-faint);}
.tj-setup-utility-row{display:flex;gap:10px;margin-bottom:18px;}
.tj-check-cell{display:flex;gap:2px;}
.tj-rr-pill{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--gold);}
.tj-plan-result{font-size:11px;margin-left:4px;}
.tj-unplanned-pill{display:inline-block;margin-left:6px;font-size:9px;text-transform:uppercase;letter-spacing:.03em;padding:2px 6px;border-radius:20px;background:var(--surface-2);color:var(--text-faint);border:1px solid var(--border);vertical-align:middle;}
.tj-unplanned-note{font-size:12px;color:var(--text-faint);font-style:italic;margin:-8px 0 14px;}
.tj-quote-card{background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:8px;padding:14px;margin-bottom:16px;}
.tj-quote-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;}

.tj-stars{display:flex;gap:2px;font-size:14px;color:var(--border);}

.tj-mood-row{display:flex;gap:6px;flex-wrap:wrap;}

  await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) {
    sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });
  }
  const json = sub.toJSON();
  const { error } = await supabase.from("push_subscriptions").upsert(
    { user_id: userId, endpoint: json.endpoint, p256dh: json.keys.p256dh, auth: json.keys.auth },
    { onConflict: "endpoint" }
  );
  if (error) throw error;
  return true;
}

/* ---------------- IndexedDB layer (legacy local data detection only) ---------------- */
const DB_NAME = "tradingJournalDB", DB_VERSION = 1;
const STORES = ["trades","tags","plans","journal","instruments","attachments","settings"];
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      STORES.forEach((name) => { if (!db.objectStoreNames.contains(name)) db.createObjectStore(name, { keyPath: "id" }); });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGetAll(storeName) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, "readonly");
    const req = tx.objectStore(storeName).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbPut(storeName, value) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, "readwrite");
    tx.objectStore(storeName).put(value);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}
async function idbDelete(storeName, id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, "readwrite");
    tx.objectStore(storeName).delete(id);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}
async function idbClear(storeName) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, "readwrite");
    tx.objectStore(storeName).clear();
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}

/* ---------------- mini charts (no external chart lib) ---------------- */
function smoothPath(points) {
  if (points.length < 2) return points.length===1 ? `M${points[0][0]},${points[0][1]}` : "";
  let d = `M${points[0][0]},${points[0][1]}`;
  for (let i=0;i<points.length-1;i++) {
    const [x0,y0]=points[i], [x1,y1]=points[i+1];
    const cx = (x0+x1)/2;
    d += ` C${cx},${y0} ${cx},${y1} ${x1},${y1}`;
  }
  return d;
}

function MiniAreaChart({ data, height=260 }) {
  const svgRef = useRef(null);
  const [hover, setHover] = useState(null);
  if (!data.length) return null;
  const width = 760, marginLeft = 66, marginRight = 16, marginTop = 16, marginBottom = 26;
  const plotW = width - marginLeft - marginRight, plotH = height - marginTop - marginBottom;
  const values = data.map((d) => d.equity);
  const min = Math.min(0, ...values), max = Math.max(0, ...values);
  const range = (max-min) || 1;
  const stepX = data.length > 1 ? plotW/(data.length-1) : 0;
  const yFor = (v) => marginTop + plotH - ((v-min)/range)*plotH;
  const points = data.map((d,i) => [marginLeft + i*stepX, yFor(d.equity)]);
  const linePath = smoothPath(points);
  const areaPath = `${linePath} L${points[points.length-1][0]},${marginTop+plotH} L${marginLeft},${marginTop+plotH} Z`;
  const zeroY = yFor(0);
  const last = data[data.length-1];
  const gridCount = 4;
  const gridY = Array.from({ length: gridCount+1 }, (_,i) => marginTop + (plotH/gridCount)*i);
  const gridVal = gridY.map((y) => min + ((marginTop+plotH-y)/plotH)*range);

  function handleMove(clientX) {
    const rect = svgRef.current.getBoundingClientRect();
    const relX = (clientX-rect.left)/rect.width*width;
    let idx = stepX ? Math.round((relX-marginLeft)/stepX) : 0;
    idx = Math.max(0, Math.min(data.length-1, idx));
    setHover(idx);
  }

  return (
    <div className="tj-chart-wrap" style={{ position:"relative" }}>
      <svg ref={svgRef} viewBox={`0 0 ${width} ${height}`} className="tj-chart-svg" preserveAspectRatio="none"
        onMouseMove={(e) => handleMove(e.clientX)} onMouseLeave={() => setHover(null)}
        onTouchMove={(e) => { if (e.touches[0]) handleMove(e.touches[0].clientX); }} onTouchEnd={() => setHover(null)}>
        <defs><linearGradient id="eqGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#C9A227" stopOpacity="0.28"/><stop offset="100%" stopColor="#C9A227" stopOpacity="0"/></linearGradient></defs>
        {gridY.map((y,i) => (
          <React.Fragment key={i}>
            <line x1={marginLeft} y1={y} x2={width-marginRight} y2={y} className="tj-chart-grid" />
            <text x={marginLeft-10} y={y+4} textAnchor="end" className="tj-chart-axis-label">{fmtMoney(gridVal[i])}</text>
          </React.Fragment>
        ))}
        <line x1={marginLeft} y1={zeroY} x2={width-marginRight} y2={zeroY} className="tj-chart-zero" />
        <path d={areaPath} fill="url(#eqGrad)" />
        <path d={linePath} fill="none" stroke="#C9A227" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
        {hover!==null && <line x1={points[hover][0]} y1={marginTop} x2={points[hover][0]} y2={marginTop+plotH} className="tj-chart-cursor" />}
        <circle cx={points[hover!==null?hover:points.length-1][0]} cy={points[hover!==null?hover:points.length-1][1]} r={hover!==null?5:4} fill="var(--bg)" stroke="#C9A227" strokeWidth="2.5" />
      </svg>
      {hover!==null && (
        <div className="tj-chart-tooltip" style={{ left:`${(points[hover][0]/width)*100}%` }}>
          <div className="tj-chart-tooltip-date">{fmtDate(data[hover].date)}</div>
          <div className={`num ${data[hover].equity>=0?"profit":"loss"}`}>{fmtMoney(data[hover].equity)}</div>
        </div>
      )}
    </div>
  );
}
function MiniBarChart({ data, height=200 }) {
  const svgRef = useRef(null);

  if (!data.length) return null;
  const marginLeft = 66, marginRight = 16, marginTop = 16, marginBottom = 26;

  const zeroY = yFor(0);

          const y = d.pnl>=0?yFor(d.pnl):zeroY;

          return <rect key={i} x={x} y={y} width={bw} height={h} rx="3" fill={d.pnl>=0?"#4FA88A":"#C1584A"} opacity={hover===null||hover===i?1:0.5} style={{ transition:"opacity .15s" }} />;

          <div className={`num ${data[hover].pnl>=0?"profit":"loss"}`}>{fmtMoney(data[hover].pnl)}</div>
        </div>

function TradingJournal({ supabase, userId, profile, onSignOut }) {

  const [planModalOpen, setPlanModalOpen] = useState(false);
  const [editingPlan, setEditingPlan] = useState(null);
  const [importOpen, setImportOpen] = useState(false);
  const [importMsg, setImportMsg] = useState(null);
  const [confirmReset, setConfirmReset] = useState(false);
  const [restoreMsg, setRestoreMsg] = useState(null);

  const [calMonth, setCalMonth] = useState(new Date().getMonth());

  const [dayFilter, setDayFilter] = useState(null);
  const [logFilters, setLogFilters] = useState({ search:"", tag:"all", from:"", to:"" });
  const [sort, setSort] = useState({ key:"date", dir:"desc" });

  useEffect(() => {
    (async () => {
      try {
        const [t,g,p,j,io,se,at,acc] = await Promise.all([
          sbLoadAll(supabase,"trades",userId), sbLoadAll(supabase,"tags",userId), sbLoadAll(supabase,"plans",userId),
          sbLoadAll(supabase,"journal",userId), sbLoadAll(supabase,"instruments",userId),
          sbLoadSettings(supabase,userId), sbLoadAttachments(supabase,userId), sbLoadAccounts(supabase,userId),
        ]);
        let accts = acc;
        let finalTrades = t, finalPlans = p, finalJournal = j;
        if (accts.length === 0) {
          const mainId = uid();
          const size = se.accountSize ? parseFloat(se.accountSize) : null;
          const mainAccount = { id: mainId, name:"Main", account_size: size };
          await sbUpsertAccount(supabase, userId, mainAccount);
          accts = [mainAccount];
          const stampAndSave = async (table, list) => {
            const needsStamp = list.filter((x) => !x.account_id);
            for (const x of needsStamp) { x.account_id = mainId; await sbUpsert(supabase, table, userId, x); }
            return list;
          };
          finalTrades = await stampAndSave("trades", t);
          finalPlans = await stampAndSave("plans", p);
          finalJournal = await stampAndSave("journal", j);
        }
        setAccounts(accts);
        const savedActive = localStorage.getItem("tj_active_account");

  }, []);

  function switchAccount(id) { setActiveAccountId(id); localStorage.setItem("tj_active_account", id); }
  async function addAccount(name, size) {
    const record = { id:uid(), name: name.trim() || "Account", account_size: size ? parseFloat(size) : null };
    await sbUpsertAccount(supabase, userId, record);
    setAccounts((prev) => [...prev, record]);
    switchAccount(record.id);
  }
  async function editAccount(id, patch) {
    const acct = accounts.find((a) => a.id===id);
    if (!acct) return;
    const updated = { ...acct, ...patch };
    await sbUpsertAccount(supabase, userId, updated);
    setAccounts((prev) => prev.map((a) => a.id===id?updated:a));
  }

    const next = accounts.filter((a) => a.id!==id);

    if (activeAccountId===id) switchAccount(next[0].id);
  }
  const visibleTrades = useMemo(() => trades.filter((t) => t.account_id===activeAccountId), [trades, activeAccountId]);
  const visiblePlans = useMemo(() => plans.filter((p) => p.account_id===activeAccountId), [plans, activeAccountId]);
  const visibleJournal = useMemo(() => journal.filter((j) => j.account_id===activeAccountId), [journal, activeAccountId]);
  const activeAccount = accounts.find((a) => a.id===activeAccountId);

  async function importLegacyData() {
    if (!legacyOffer) return;
    setLegacyImporting(true);
    try {
      const [lt, lg, lp, lj, lio, lse] = await Promise.all([
        idbGetAll("trades"), idbGetAll("tags"), idbGetAll("plans"), idbGetAll("journal"), idbGetAll("instruments"), idbGetAll("settings"),
      ]);
      for (const t of lt) await sbUpsert(supabase, "trades", userId, t);
      for (const g of lg) await sbUpsert(supabase, "tags", userId, g);
      for (const p of lp) await sbUpsert(supabase, "plans", userId, p);
      for (const j of lj) await sbUpsert(supabase, "journal", userId, j);
      for (const i of lio) await sbUpsert(supabase, "instruments", userId, i);
      if (lse && lse[0]) await sbSaveSettings(supabase, userId, lse[0]);
      setTrades(lt); setTags(lg); setPlans(lp); setJournal(lj); setInstrumentOverrides(lio);
      if (lse && lse[0]) setSettings({ accountSize:"", checklist:[...DEFAULT_CHECKLIST], visibleSections:{...DEFAULT_VISIBLE_SECTIONS}, showPlanVsActualGap:false, setupVisible:{...DEFAULT_SETUP_VISIBLE}, planPageVisible:{watchlist:true,history:true}, ...lse[0] });
    } catch (e) { console.error(e); }
    setLegacyImporting(false); setLegacyOffer(null);
  }

  const flashSave = () => { setSaveFlash(true); setTimeout(() => setSaveFlash(false), 900); };

    await sbUpsert(supabase, "trades", userId, record);
    setTrades((prev) => trade.id ? prev.map((t) => t.id===id?record:t) : [record, ...prev]);
    if (trade.planId) {
      const plan = plans.find((p) => p.id===trade.planId);
      if (plan) { const updated = { ...plan, status:"Taken", linkedTradeId:id }; await sbUpsert(supabase, "plans", userId, updated); setPlans((prev) => prev.map((p) => p.id===plan.id?updated:p)); }
    }

    setModalOpen(false); setEditingTrade(null); setTradePrefill(null);
  }
  async function deleteTrade(id) { await sbDelete(supabase, "trades", id); setTrades((prev) => prev.filter((t) => t.id!==id)); }

  async function addTag(name, color, icon) {
    const clean = name.trim();
    if (!clean || tags.some((t) => t.name.toLowerCase()===clean.toLowerCase())) return;
    const record = { id:uid(), name:clean, color, icon: icon || "" };
    await sbUpsert(supabase, "tags", userId, record); setTags((prev) => [...prev, record]);
  }
  async function deleteTag(id) {
    const tag = tags.find((t) => t.id===id);
    await sbDelete(supabase, "tags", id); setTags((prev) => prev.filter((t) => t.id!==id));
    if (tag) {
      const affected = trades.filter((t) => (t.tags||(t.tag?[t.tag]:[])).includes(tag.name));
      for (const t of affected) { const upd = { ...t, tags:(t.tags||(t.tag?[t.tag]:[])).filter((x) => x!==tag.name), tag:"" }; await sbUpsert(supabase, "trades", userId, upd); }
      setTrades((prev) => prev.map((t) => (t.tags||(t.tag?[t.tag]:[])).includes(tag.name) ? { ...t, tags:(t.tags||(t.tag?[t.tag]:[])).filter((x) => x!==tag.name), tag:"" } : t));
    }
  }

  const PLAN_VERSION_FIELDS = ["direction","session","setupTags","entryZone","stopLoss","takeProfit","riskPercent","thesis","checklist","status"];
  async function upsertPlan(plan) {
    const id = plan.id || uid();
    const existing = plans.find((p) => p.id===id);
    let versionHistory = existing?.versionHistory || [];
    if (existing && existing.status !== "Taken") {
      const oldSlice = Object.fromEntries(PLAN_VERSION_FIELDS.map((k) => [k, existing[k]]));
      const newSlice = Object.fromEntries(PLAN_VERSION_FIELDS.map((k) => [k, plan[k]]));
      if (JSON.stringify(oldSlice) !== JSON.stringify(newSlice)) {
        versionHistory = [...versionHistory, { snapshot: oldSlice, savedAt: new Date().toISOString() }];
      }
    }
    const record = { ...plan, id, versionHistory, account_id: plan.account_id || activeAccountId, createdAt: plan.createdAt || todayStr() };
    await sbUpsert(supabase, "plans", userId, record);
    setPlans((prev) => plan.id && prev.some((p) => p.id===id) ? prev.map((p) => p.id===id?record:p) : [record, ...prev.filter((p) => p.id!==id)]);
    flashSave();
    setPlanModalOpen(false); setEditingPlan(null);
  }
  async function deletePlan(id) {
    const plan = plans.find((p) => p.id===id);
    if (plan?.status === "Taken") return; // executed plans are a permanent record
    const orphans = attachments.filter((a) => a.owner_type==="plan" && a.owner_id===id);
    for (const a of orphans) await removeAttachment(a.id);
    await sbDelete(supabase, "plans", id); setPlans((prev) => prev.filter((p) => p.id!==id));
  }
  function logPlanAsTrade(plan) {
    const acct = parseFloat(activeAccount?.account_size);
    const riskPct = parseFloat(plan.riskPercent);
    const riskDollars = (!isNaN(acct) && !isNaN(riskPct)) ? ((acct*riskPct)/100).toFixed(2) : "";
    const inst = instruments.find((i) => i.symbol===plan.symbol);
    let lots = "";
    const entryNum = parseFloat(plan.entryZone), slNum = parseFloat(plan.stopLoss);
    if (!isNaN(acct) && !isNaN(riskPct) && !isNaN(entryNum) && !isNaN(slNum) && inst?.pointSize && inst?.pointValue) {
      const riskDollarsCalc = acct * riskPct / 100;
      const pointsAtRisk = Math.abs(entryNum - slNum) / inst.pointSize;
      if (pointsAtRisk > 0) lots = (riskDollarsCalc / (pointsAtRisk * inst.pointValue)).toFixed(2);
    }
    setTradePrefill({
      date: plan.date, symbol: plan.symbol,
      direction: plan.direction==="Short" ? "short" : "long",
      tags: plan.setupTags || (plan.setupType?[plan.setupType]:[]), risk: riskDollars,
      entry: !isNaN(entryNum) ? plan.entryZone : "", lots,
      notes: plan.thesis || "", planId: plan.id, account_id: activeAccountId,
    });
    setEditingTrade(null); setModalOpen(true);
  }

  async function addAttachment(ownerType, ownerId, file) {
    let uploadFile = file;
    if (file.type.startsWith("image/")) uploadFile = await resizeImageFile(file);
    const uploaded = await sbUploadFile(supabase, userId, new File([uploadFile], file.name, { type: uploadFile.type||file.type }));
    if (!uploaded) return null;
    const record = { id:uid(), user_id:userId, owner_type:ownerType, owner_id:ownerId, filename:file.name, mime_type: uploadFile.type||file.type, storage_path: uploaded.path, size: uploadFile.size, created_at: new Date().toISOString() };
    const { error } = await supabase.from("attachments").insert(record);
    if (error) { console.error(error); return null; }
    const withUrl = { ...record, publicUrl: uploaded.publicUrl };
    setAttachments((prev) => [...prev, withUrl]);
    return withUrl;
  }
  async function removeAttachment(id) {
    const att = attachments.find((a) => a.id===id);
    if (att) await supabase.storage.from(SUPABASE_BUCKET).remove([att.storage_path]);
    await supabase.from("attachments").delete().eq("id", id);
    setAttachments((prev) => prev.filter((a) => a.id!==id));
  }

  async function upsertJournalForDate(entry) {
    const existing = journal.find((j) => j.date===entry.date && j.account_id===activeAccountId);
    const record = { ...entry, id: existing ? existing.id : uid(), account_id: activeAccountId };
    await sbUpsert(supabase, "journal", userId, record);
    setJournal((prev) => existing ? prev.map((j) => j.id===record.id?record:j) : [record, ...prev]);
    flashSave();
    return record;
  }

  async function saveInstrumentSpec(symbol, updated) {
    await sbUpsert(supabase, "instruments", userId, updated);

  async function resetInstrument(symbol) {
    const existing = instrumentOverrides.find((o) => o.symbol===symbol);
    if (existing) await sbDelete(supabase, "instruments", existing.id || symbol);
    setInstrumentOverrides((prev) => prev.filter((o) => o.symbol!==symbol));

  async function saveSettings(next) { await sbSaveSettings(supabase, userId, next); setSettings(next); }

  const instruments = useMemo(() => {
    const map = {};
    DEFAULT_INSTRUMENTS.forEach((i) => (map[i.symbol] = i));
    instrumentOverrides.forEach((i) => (map[i.symbol] = { ...i, id: i.symbol }));
    return Object.values(map).sort((a,b) => a.category.localeCompare(b.category) || a.symbol.localeCompare(b.symbol));
  }, [instrumentOverrides]);

  function handleCsvFile(file) {
    Papa.parse(file, {
      header: true, skipEmptyLines: true,
      complete: async (results) => {
        let added = 0, skipped = 0;
        const newTags = [...tags]; const newTradeRecords = [];
        for (const row of results.data) {
          const date = (row.date||"").trim(); const symbol = (row.symbol||"").trim().toUpperCase();
          if (!date || !symbol) { skipped++; continue; }
          const inst = instruments.find((i) => i.symbol===symbol);
          const pointSize = row.pointSize || inst?.pointSize || 1;
          const pointValue = row.pointValue || inst?.pointValue || 1;
          let pnl = parseFloat(row.pnl);
          if (isNaN(pnl)) { const calc = calcPnl({ entry:row.entry, exit:row.exit, lots:row.lots, direction:row.direction, fees:row.fees, pointSize, pointValue }); pnl = calc ? calc.pnl : 0; }
          const tagNames = (row.tags || row.tag || "").split(";").map((s) => s.trim()).filter(Boolean);
          for (const tagName of tagNames) {
            if (!newTags.some((t) => t.name.toLowerCase()===tagName.toLowerCase())) newTags.push({ id:uid(), name:tagName, color:TAG_COLORS[newTags.length % TAG_COLORS.length], icon:"" });
          }
          const rec = { id:uid(), date, symbol, category: row.category || inst?.category || "Other",
            direction: (row.direction||"long").toLowerCase()==="short"?"short":"long",
            entry: row.entry||"", exit: row.exit||"", lots: row.lots||"", pointSize, pointValue,
            fees: row.fees||"", risk: row.risk||"", pnl, tags: tagNames, session: row.session||"", notes: row.notes||"", account_id: activeAccountId };
          newTradeRecords.push(rec); added++;
        }
        for (const rec of newTradeRecords) await sbUpsert(supabase, "trades", userId, rec);
        for (const t of newTags) if (!tags.some((x) => x.id===t.id)) await sbUpsert(supabase, "tags", userId, t);
        setTrades((prev) => [...newTradeRecords, ...prev]);
        if (newTags.length !== tags.length) setTags(newTags);
        setImportMsg(`Imported ${added} trade${added===1?"":"s"} into ${activeAccount?.name||"this account"}${skipped?`, skipped ${skipped} (missing date/symbol)`:""}.`);
      },
      error: (err) => setImportMsg(`Import failed: ${err.message}`),
    });
  }
  function exportCsv() {
    const rows = visibleTrades.map((t) => Object.fromEntries(CSV_HEADERS.map((h) => [h, h==="tags" ? (t.tags||(t.tag?[t.tag]:[])).join(";") : (t[h] ?? "")])));
    downloadBlob(Papa.unparse({ fields: CSV_HEADERS, data: rows }), `trading-journal-${(activeAccount?.name||"export").toLowerCase().replace(/\s+/g,"-")}-${todayStr()}.csv`, "text/csv");
  }
  function downloadTemplate() {
    const csv = Papa.unparse({ fields: CSV_HEADERS, data: [["2026-08-12","XAUUSD","Metals","long","2415.20","2421.80","0.50","0.01","1","0","150","44.50","Breakout;London Session","New York","Clean break of London high"]] });
    downloadBlob(csv, "trading-journal-template.csv", "text/csv");
  }
  function exportBackup() {
    const backup = { type:"trading-journal-backup", version:3, exportedAt:new Date().toISOString(), trades, tags, plans, journal, instrumentOverrides, settings, accounts, profile:{ username: localProfile.username||null, avatar_url: localProfile.avatar_url||null }, note:"Attachments (images/files) are not included — they stay in this browser's storage." };
    downloadBlob(JSON.stringify(backup, null, 2), `trading-journal-backup-${todayStr()}.json`, "application/json");
  }
  function importBackup(file) {
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data || data.type !== "trading-journal-backup") { setRestoreMsg("That doesn't look like a Trading Journal backup file."); return; }
        // Restore accounts first so trades/plans/journal below have somewhere valid to point to.
        const backedUpAccounts = data.accounts || [];
        for (const a of backedUpAccounts) await sbUpsertAccount(supabase, userId, a);
        let restoredAccounts = accounts;
        if (backedUpAccounts.length) {
          restoredAccounts = [...accounts.filter((a) => !backedUpAccounts.some((b) => b.id===a.id)), ...backedUpAccounts];
          setAccounts(restoredAccounts);
        }
        const fallbackAccountId = restoredAccounts[0]?.id || activeAccountId;
        const withAccount = (list) => (list||[]).map((x) => ({ ...x, account_id: x.account_id || fallbackAccountId }));
        const restoredTrades = withAccount(data.trades), restoredPlans = withAccount(data.plans), restoredJournal = withAccount(data.journal);
        for (const t of restoredTrades) await sbUpsert(supabase, "trades", userId, t);
        for (const g of data.tags||[]) await sbUpsert(supabase, "tags", userId, g);
        for (const p of restoredPlans) await sbUpsert(supabase, "plans", userId, p);
        for (const j of restoredJournal) await sbUpsert(supabase, "journal", userId, j);
        for (const i of data.instrumentOverrides||[]) await sbUpsert(supabase, "instruments", userId, i);
        if (data.settings) await sbSaveSettings(supabase, userId, data.settings);
        if (data.profile && (data.profile.username || data.profile.avatar_url)) await updateProfile({ username: data.profile.username || null, avatar_url: data.profile.avatar_url || null });
        setTrades(restoredTrades); setTags(data.tags||[]); setPlans(restoredPlans); setJournal(restoredJournal);
        setInstrumentOverrides(data.instrumentOverrides||[]); if (data.settings) setSettings(data.settings);
        setRestoreMsg(`Restored ${restoredTrades.length} trade(s), ${restoredPlans.length} plan(s), ${restoredJournal.length} journal entr${restoredJournal.length===1?"y":"ies"}${backedUpAccounts.length?`, ${backedUpAccounts.length} account(s)`:""}.`);
      } catch (e) { console.error(e); setRestoreMsg("Couldn't read that file — make sure it's a backup exported from this app."); }
    };
    reader.readAsText(file);
  }

  const stats = useMemo(() => {
    if (!visibleTrades.length) return null;
    const sorted = [...visibleTrades].sort((a,b) => new Date(a.date)-new Date(b.date));
    let cum = 0; const equity = sorted.map((t) => { cum += t.pnl; return { date:t.date, equity:cum }; });
    const wins = visibleTrades.filter((t) => t.pnl>0), losses = visibleTrades.filter((t) => t.pnl<0);
    const netPnl = visibleTrades.reduce((a,t) => a+t.pnl, 0);
    const winRate = (wins.length/visibleTrades.length)*100;
    const grossWin = wins.reduce((a,t) => a+t.pnl, 0);
    const grossLoss = Math.abs(losses.reduce((a,t) => a+t.pnl, 0));
    const profitFactor = grossLoss>0 ? grossWin/grossLoss : (grossWin>0?Infinity:0);
    const avgWin = wins.length ? grossWin/wins.length : 0;
    const avgLoss = losses.length ? grossLoss/losses.length : 0;
    const best = visibleTrades.reduce((m,t) => t.pnl>m.pnl?t:m, visibleTrades[0]);
    const worst = losses.length ? losses.reduce((m,t) => t.pnl<m.pnl?t:m, losses[0]) : null;
    let streak=0, streakType=null;
    for (let i=sorted.length-1;i>=0;i--) { const isWin=sorted[i].pnl>0; if (streakType===null){streakType=isWin;streak=1;} else if (isWin===streakType) streak++; else break; }
    const rTrades = visibleTrades.filter((t) => parseFloat(t.risk)>0);
    const avgR = rTrades.length ? rTrades.reduce((a,t) => a+t.pnl/parseFloat(t.risk),0)/rTrades.length : null;
    return { equity, netPnl, winRate, profitFactor, avgWin, avgLoss, best, worst, streak, streakType, wins:wins.length, losses:losses.length, total:visibleTrades.length, avgR };
  }, [visibleTrades]);

  const dailyMap = useMemo(() => { const m={}; visibleTrades.forEach((t) => { m[t.date]=(m[t.date]||0)+t.pnl; }); return m; }, [visibleTrades]);

  const journalDates = useMemo(() => new Set(visibleJournal.map((j) => j.date)), [visibleJournal]);
  const tagStats = useMemo(() => tags.map((tag) => {
    const list = visibleTrades.filter((t) => (t.tags||(t.tag?[t.tag]:[])).includes(tag.name));
    const net = list.reduce((a,t) => a+t.pnl, 0);
    const wins = list.filter((t) => t.pnl>0).length;
    return { ...tag, count:list.length, net, winRate: list.length ? (wins/list.length)*100 : 0 };

  const filteredTrades = useMemo(() => {

    if (logFilters.from) list = list.filter((t) => t.date >= logFilters.from);

      )}
      {profileModalOpen && (
        <ProfileModal profile={localProfile} trades={visibleTrades} stats={stats} supabase={supabase} userId={userId}
          onUpdate={updateProfile} onClose={() => setProfileModalOpen(false)} onSignOut={onSignOut} />

      {importOpen && (
        <div className="tj-overlay" onClick={() => { setImportOpen(false); setImportMsg(null); }}>
          <div className="tj-modal tj-modal-sm" onClick={(e) => e.stopPropagation()}>

            <div className="tj-modal-footer"><button className="tj-btn tj-btn-ghost" onClick={() => { setImportOpen(false); setImportMsg(null); }}>Done</button></div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ================= CALENDAR ================= */
function CalendarView({ month, year, dailyMap, trades, journalDates, onNav, onDayClick }) {
  const first = new Date(year, month, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const cells = [];
  for (let i=0;i<startWeekday;i++) cells.push(null);
  for (let d=1; d<=daysInMonth; d++) cells.push({ d, date:`${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}` });
  while (cells.length % 7 !== 0) cells.push(null);
  const rows = []; for (let i=0;i<cells.length;i+=7) rows.push(cells.slice(i,i+7));
  const monthPnl = Object.entries(dailyMap).filter(([date]) => { const dt=new Date(date+"T00:00:00"); return dt.getMonth()===month && dt.getFullYear()===year; }).reduce((a,[,v]) => a+v, 0);
  const countForDay = (dateStr) => trades.filter((t) => t.date===dateStr).length;
  return (
    <div className="tj-calendar">
      <div className="tj-cal-header">
        <button className="tj-btn tj-btn-ghost" onClick={() => onNav(-1)}>‹</button>
        <div className="tj-cal-title"><h3>{MONTH_NAMES[month]} {year}</h3><span className={`num ${monthPnl>=0?"profit":"loss"}`}>{fmtMoney(monthPnl)}</span></div>
        <button className="tj-btn tj-btn-ghost" onClick={() => onNav(1)}>›</button>
      </div>
      <div className="tj-cal-week tj-cal-weekhead">{WEEKDAYS.map((w) => <div key={w} className="tj-cal-wd">{w}</div>)}<div className="tj-cal-wd">Week</div></div>
      {rows.map((row, ri) => {
        const weekTotal = row.reduce((a,c) => a + (c && dailyMap[c.date]!==undefined ? dailyMap[c.date] : 0), 0);
        const hasAny = row.some((c) => c && dailyMap[c.date]!==undefined);
        return (
          <div className="tj-cal-week" key={ri}>
            {row.map((c, ci) => {
              if (!c) return <div key={ci} className="tj-cal-cell empty" />;
              const pnl = dailyMap[c.date]; const count = countForDay(c.date); const isToday = c.date===todayStr(); const hasJournal = journalDates.has(c.date);
              return (
                <button key={ci} className={`tj-cal-cell ${pnl!==undefined?(pnl>=0?"profit":"loss"):""} ${isToday?"today":""}`} disabled={!count} onClick={() => onDayClick(c.date)}>
                  {hasJournal && <span className="tj-cal-journal-dot" title="Journal entry" />}
                  <span className="tj-cal-daynum">{c.d}</span>
                  {pnl!==undefined && <span className="num tj-cal-pnl">{fmtMoney(pnl)}</span>}
                  {count>0 && <span className="tj-cal-count">{count} trade{count>1?"s":""}</span>}
                </button>
              );
            })}
            <div className={`tj-week-total ${hasAny?(weekTotal>=0?"profit":"loss"):""}`}>{hasAny ? <span className="num">{fmtMoney(weekTotal)}</span> : <span className="tj-muted">—</span>}</div>
          </div>
        );
      })}
    </div>
  );
}

function PlanView({ plans, tags, instruments, trades, settings, activeAccount, onAddPlan, onEditPlan, onDeletePlan, onLogTrade, onViewTrade, onSaveSettings }) {
  const visible = settings.planPageVisible || { watchlist:true, history:true };
  const acct = parseFloat(activeAccount?.account_size);
  const watchlist = plans.filter((p) => ["Watching","Triggered"].includes(p.status)).sort((a,b) => new Date(b.date)-new Date(a.date));
  const history = plans.filter((p) => ["Taken","Skipped","Invalidated"].includes(p.status)).sort((a,b) => new Date(b.date)-new Date(a.date));

  function togglePart(key) { onSaveSettings({ ...settings, planPageVisible: { ...visible, [key]: !visible[key] } }); }

  function renderPlanTable(list, emptyText) {
    if (list.length===0) return <div className="tj-empty small"><p>{emptyText}</p></div>;
    return (
      <div className="tj-table-wrap">
        <table className="tj-table">
          <thead><tr><th>Date</th><th>Instrument</th><th>Session</th><th>Tags</th><th>Risk %</th><th>Entry</th><th>Stop</th><th>Target</th><th>R:R</th><th>Checklist</th><th>Status</th><th>📎</th><th></th></tr></thead>
          <tbody>
            {list.map((p) => {
              const entryNum = parseFloat(p.entryZone), sl = parseFloat(p.stopLoss), tp = parseFloat(p.takeProfit);
              let rr = null;
              if (!isNaN(entryNum) && !isNaN(sl) && !isNaN(tp)) { const risk=Math.abs(entryNum-sl), reward=Math.abs(tp-entryNum); if (risk>0) rr = reward/risk; }
              const riskPct = parseFloat(p.riskPercent);
              const riskDollar = (!isNaN(acct) && !isNaN(riskPct)) ? fmtMoney((acct*riskPct)/100) : null;
              const checklist = p.checklist || [];
              const attCount = p.attachmentIds ? p.attachmentIds.length : 0;
              const pTags = p.setupTags || (p.setupType?[p.setupType]:[]);
              const isTaken = p.status==="Taken";
              const linkedTrade = isTaken && p.linkedTradeId ? trades.find((t) => t.id===p.linkedTradeId) : null;
              return (
                <tr key={p.id} style={{ cursor:"pointer" }}>
                  <td className="num" onClick={() => onEditPlan(p)}>{fmtDate(p.date)}</td>
                  <td className="tj-symbol" onClick={() => onEditPlan(p)}>{p.symbol}</td>
                  <td className="tj-muted" onClick={() => onEditPlan(p)}>{p.session || "—"}</td>
                  <td onClick={() => onEditPlan(p)}>{pTags.map((tn) => { const tg = tags.find((x) => x.name===tn); return <span key={tn} className="tj-tag-pill" style={{ marginRight:4 }}>{tg?.icon} {tn}</span>; })}</td>
                  <td className="num" onClick={() => onEditPlan(p)}>{p.riskPercent ? `${p.riskPercent}%` : "—"}{riskDollar ? <span className="tj-muted"> ({riskDollar})</span> : ""}</td>
                  <td className="num" onClick={() => onEditPlan(p)}>{p.entryZone || "—"}</td>
                  <td className="num" onClick={() => onEditPlan(p)}>{p.stopLoss || "—"}</td>
                  <td className="num" onClick={() => onEditPlan(p)}>{p.takeProfit || "—"}</td>
                  <td onClick={() => onEditPlan(p)}>{rr!==null ? <span className="tj-rr-pill">1:{rr.toFixed(2)}</span> : "—"}</td>
                  <td onClick={() => onEditPlan(p)}>
                    <div className="tj-check-cell">
                      {checklist.length===0 ? <span className="tj-muted">—</span> : checklist.map((c,i) => <span key={i} className={`tj-check-glyph ${c.status||""}`} title={c.criterion}>{c.status==="pass"?"✓":c.status==="fail"?"✗":"–"}</span>)}
                    </div>
                  </td>
                  <td onClick={() => onEditPlan(p)}>
                    <span className={`tj-status-pill status-${p.status.toLowerCase()}`}>{p.status}</span>
                    {linkedTrade && <span className={`num tj-plan-result ${linkedTrade.pnl>=0?"profit":"loss"}`}> {fmtMoney(linkedTrade.pnl)}</span>}
                  </td>
                  <td className="tj-muted" onClick={() => onEditPlan(p)}>{attCount>0 ? attCount : "—"}</td>
                  <td className="tj-row-actions">
                    {["Watching","Triggered"].includes(p.status) && <button className="tj-icon-btn" onClick={() => onLogTrade(p)} title="Log as trade">▶</button>}
                    {linkedTrade && <button className="tj-icon-btn" onClick={() => onViewTrade(linkedTrade)} title="View trade">→</button>}
                    <button className="tj-icon-btn" onClick={() => onEditPlan(p)} aria-label={isTaken?"View":"Edit"}>{isTaken?"👁":"✎"}</button>
                    {!isTaken && <button className="tj-icon-btn" onClick={() => onDeletePlan(p.id)} aria-label="Delete">✕</button>}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    );
  }

  return (
    <div>
      <div className="tj-plan-toolbar">
        <div className="tj-view-toggles">
          <button className={`tj-toggle-chip ${visible.watchlist?"on":""}`} onClick={() => togglePart("watchlist")}>{visible.watchlist?"✓ ":""}Watchlist</button>
          <button className={`tj-toggle-chip ${visible.history?"on":""}`} onClick={() => togglePart("history")}>{visible.history?"✓ ":""}History</button>
        </div>
        <button className="tj-btn tj-btn-primary" onClick={onAddPlan} style={{ marginLeft:"auto" }}>+ Plan a trade</button>
      </div>

      {plans.length===0 ? (
        <div className="tj-empty"><span className="tj-empty-mark">§</span><h2>No plans yet</h2><p>Before the market opens, write down what you're watching, your levels, your risk, and your checklist — decide it here, not in the moment.</p><button className="tj-btn tj-btn-primary" onClick={onAddPlan}>+ Plan your first trade</button></div>
      ) : (
        <React.Fragment>
          {visible.watchlist && (
            <React.Fragment>
              <h3 className="tj-section-title">Watchlist</h3>
              {renderPlanTable(watchlist, "Nothing on your watchlist right now — plan a trade to get started.")}
            </React.Fragment>
          )}
          {visible.history && (
            <React.Fragment>
              <h3 className="tj-section-title" style={{ marginTop:28 }}>History</h3>
              <p className="tj-muted" style={{ marginTop:-8, marginBottom:12 }}>Taken, skipped, and invalidated setups — a permanent record of everything you've considered.</p>
              {renderPlanTable(history, "Nothing here yet.")}
            </React.Fragment>
          )}
          {!visible.watchlist && !visible.history && <div className="tj-empty small"><p>Both Watchlist and History are hidden. Toggle one on above.</p></div>}
        </React.Fragment>
      )}
    </div>
  );
}

function ReferralsList({ supabase, referralCode }) {
  const [referrals, setReferrals] = useState(null);
  useEffect(() => {
    if (!referralCode) return;
    (async () => {
      const { data, error } = await supabase.from("profiles").select("subscription_status, subscription_expires_at, plan").eq("referred_by", referralCode);
      if (!error) setReferrals(data || []);
    })();
  }, [referralCode]);

  if (referrals === null) return null;
  const isPaying = (r) => r.subscription_status==="active" && r.subscription_expires_at && new Date(r.subscription_expires_at) > new Date();
  const paidCount = referrals.filter(isPaying).length;
  const trialCount = referrals.length - paidCount;
  const byPlan = PLANS.map((pl) => ({ ...pl, count: referrals.filter((r) => isPaying(r) && r.plan===pl.id).length }));

  return (
    <div style={{ marginTop:18, borderTop:"1px dashed var(--border)", paddingTop:14 }}>
      <span className="tj-muted">Your referrals</span>
      {referrals.length === 0 ? (
        <p className="tj-muted" style={{ marginTop:8 }}>Nobody has signed up with your link yet.</p>
      ) : (
        <React.Fragment>
          <div className="tj-referral-counts">
            <div><span className="num tj-referral-num">{referrals.length}</span><span className="tj-muted">signed up</span></div>
            <div><span className="num tj-referral-num profit">{paidCount}</span><span className="tj-muted">paying</span></div>
            <div><span className="num tj-referral-num">{trialCount}</span><span className="tj-muted">on trial</span></div>
          </div>
          {paidCount > 0 && (
            <div className="tj-referral-plan-breakdown">
              {byPlan.map((pl) => <span key={pl.id} className="tj-tag-pill">{pl.label}: <strong className="num">{pl.count}</strong></span>)}
            </div>
          )}
        </React.Fragment>
      )}
    </div>
  );
}

function AccountsManager({ accounts, activeAccountId, onAdd, onEdit, onDelete, onSwitch }) {
  const [name, setName] = useState(""); const [size, setSize] = useState("");
  const [editingId, setEditingId] = useState(null);
  const [editSize, setEditSize] = useState("");
  const [editName, setEditName] = useState("");

  function startEdit(a) { setEditingId(a.id); setEditSize(a.account_size ?? ""); setEditName(a.name); }
  function commitEdit() { onEdit(editingId, { name: editName.trim()||"Account", account_size: editSize?parseFloat(editSize):null }); setEditingId(null); }

  return (
    <div>
      <div className="tj-inst-table">
        <div className="tj-inst-row tj-inst-head"><span>Name</span><span>Account size ($)</span><span></span><span></span></div>
        {accounts.map((a) => (
          <div className="tj-inst-row" key={a.id} style={{ gridTemplateColumns:"1.4fr 1fr 1fr 70px" }}>
            {editingId===a.id ? (
              <React.Fragment>
                <input className="tj-input tj-inst-input" value={editName} onChange={(e) => setEditName(e.target.value)} />
                <input className="tj-input tj-inst-input" type="number" step="any" value={editSize} onChange={(e) => setEditSize(e.target.value)} />
                <button className="tj-link" onClick={commitEdit}>Save</button>
              </React.Fragment>
            ) : (
              <React.Fragment>
                <span className="tj-symbol">{a.name}{a.id===activeAccountId && <span className="tj-muted"> · active</span>}</span>
                <span className="num">{a.account_size ? fmtMoney(a.account_size) : "—"}</span>
                <span style={{ display:"flex", gap:8 }}>
                  {a.id!==activeAccountId && <button className="tj-link" onClick={() => onSwitch(a.id)}>Switch to</button>}
                  <button className="tj-link" onClick={() => startEdit(a)}>Edit</button>
                </span>
              </React.Fragment>
            )}
            <span className="tj-inst-actions">{accounts.length>1 && <button className="tj-icon-btn" onClick={() => { if (window.confirm(`Delete "${a.name}"? Its trades, plans and journal entries stay in the database but won't be visible from any account.`)) onDelete(a.id); }} aria-label="Delete">✕</button>}</span>
          </div>
        ))}
      </div>
      <div className="tj-inst-add">
        <input className="tj-input" placeholder="Account name e.g. Demo" value={name} onChange={(e) => setName(e.target.value)} />
        <input className="tj-input" type="number" step="any" placeholder="Account size ($)" value={size} onChange={(e) => setSize(e.target.value)} />
        <button className="tj-btn tj-btn-primary" onClick={() => { if (name.trim()) { onAdd(name, size); setName(""); setSize(""); } }}>+ Add account</button>
      </div>
    </div>
  );
}

function InstrumentRow({ inst, isDefault, onSave, onReset, onDelete }) {
  const [ps, setPs] = useState(String(inst.pointSize)); const [pv, setPv] = useState(String(inst.pointValue));
  useEffect(() => { setPs(String(inst.pointSize)); setPv(String(inst.pointValue)); }, [inst.pointSize, inst.pointValue]);
  const overridden = isDefault && DEFAULT_INSTRUMENTS.find((d) => d.symbol===inst.symbol)?.pointValue !== inst.pointValue;
  function commit() { const nps=parseFloat(ps), npv=parseFloat(pv); if (isNaN(nps)||isNaN(npv)) return; if (nps===inst.pointSize && npv===inst.pointValue) return; onSave(inst.symbol, { ...inst, id: inst.symbol, pointSize:nps, pointValue:npv }); }
  return (
    <div className="tj-inst-row">
      <span className="tj-symbol">{inst.symbol}{inst.label ? <span className="tj-muted"> · {inst.label}</span> : ""}</span>
      <span className="tj-muted">{inst.category}</span>
      <input className="tj-input tj-inst-input" type="number" step="any" value={ps} onChange={(e) => setPs(e.target.value)} onBlur={commit} />
      <input className="tj-input tj-inst-input" type="number" step="any" value={pv} onChange={(e) => setPv(e.target.value)} onBlur={commit} />
      <span className="tj-inst-actions">{overridden && <button className="tj-link" onClick={() => onReset(inst.symbol)}>Reset</button>}{!isDefault && <button className="tj-icon-btn" onClick={() => onDelete(inst.symbol)} aria-label="Delete">✕</button>}</span>
    </div>
  );
}
