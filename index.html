function PlanQuoteCard({ plan, entry, exit, riskDollars, accountSize, tradeDate, showGap }) {
  const [expanded, setExpanded] = useState(false);
  if (!plan) return null;
  const plannedAt = plan.createdAt ? fmtDate(plan.createdAt) : null;
  const daysGap = (plan.createdAt && tradeDate) ? Math.round((new Date(tradeDate+"T00:00:00").getTime() - new Date(plan.createdAt+"T00:00:00").getTime()) / 86400000) : null;
  const checklist = plan.checklist || [];
  const passCount = checklist.filter((c) => c.status==="pass").length;
  const entryNum = parseFloat(entry), plannedEntry = parseFloat(plan.entryZone);
  const entryGap = showGap && !isNaN(entryNum) && !isNaN(plannedEntry) ? entryNum-plannedEntry : null;
  const plannedRisk = parseFloat(plan.riskPercent);
  const acctNum = parseFloat(accountSize), riskDollarsNum = parseFloat(riskDollars);
  const actualRisk = (!isNaN(acctNum) && acctNum>0 && !isNaN(riskDollarsNum)) ? (riskDollarsNum/acctNum)*100 : null;
  const riskGap = showGap && actualRisk!==null && !isNaN(plannedRisk) ? actualRisk-plannedRisk : null;
  return (
    <div className="tj-quote-card">
      <div className="tj-quote-head">
        <span className="tj-quote-label">📝 From your plan{plannedAt?` — written ${plannedAt}`:""}{daysGap>0 ? ` (${daysGap} day${daysGap===1?"":"s"} before this trade)` : daysGap===0 ? " (same day)" : daysGap<0 ? ` (${Math.abs(daysGap)} day${Math.abs(daysGap)===1?"":"s"} after this trade date)` : ""}</span>
        <span className={`tj-status-pill status-${(plan.status||"").toLowerCase()}`}>{plan.status}</span>
      </div>
      <div className="tj-quote-levels">
        <div><span className="tj-muted">Planned entry</span><span className="num">{plan.entryZone||"—"}{entryGap!==null && <span className={entryGap===0?"tj-muted":(entryGap>0?"loss":"profit")}> ({entryGap===0?"exact":`${entryGap>0?"+":""}${entryGap.toFixed(5).replace(/0+$/,"").replace(/\.$/,"")}`})</span>}</span></div>
        <div><span className="tj-muted">Stop</span><span className="num">{plan.stopLoss||"—"}</span></div>
        <div><span className="tj-muted">Target</span><span className="num">{plan.takeProfit||"—"}</span></div>
        <div><span className="tj-muted">Planned risk</span><span className="num">{plan.riskPercent?`${plan.riskPercent}%`:"—"}{riskGap!==null && <span className={Math.abs(riskGap)<0.01?"tj-muted":(riskGap>0?"loss":"profit")}> ({Math.abs(riskGap)<0.01?"exact":`${riskGap>0?"+":""}${riskGap.toFixed(2)}%`})</span>}</span></div>
        {checklist.length>0 && <div><span className="tj-muted">Checklist</span><span className="num">{passCount}/{checklist.length} passed</span></div>}
      </div>
      {plan.thesis && <p className="tj-quote-thesis">{plan.thesis}</p>}
      {(plan.versionHistory?.length > 0 || plan.attachmentIds?.length > 0) && (
        <button type="button" className="tj-link" onClick={() => setExpanded((e) => !e)}>{expanded?"Hide details":`Show planning details${plan.versionHistory?.length?` (${plan.versionHistory.length} revision${plan.versionHistory.length===1?"":"s"})`:""}`}</button>
      )}
      {expanded && (
        <div className="tj-quote-expanded">
          {checklist.length>0 && (
            <div className="tj-check-cell" style={{ marginBottom:8 }}>
              {checklist.map((c,i) => <span key={i} className={`tj-check-glyph ${c.status||""}`} title={c.criterion}>{c.status==="pass"?"✓":c.status==="fail"?"✗":"–"}</span>)}
            </div>
          )}
          {plan.versionHistory?.length > 0 && (
            <div className="tj-version-list">
              {plan.versionHistory.map((v,i) => (
                <div key={i} className="tj-version-item">
                  <span className="tj-muted num">{fmtDateTimeShort(v.savedAt)}</span>
                  <span>{v.snapshot.direction} · entry {v.snapshot.entryZone||"—"} · stop {v.snapshot.stopLoss||"—"} · target {v.snapshot.takeProfit||"—"} · risk {v.snapshot.riskPercent?`${v.snapshot.riskPercent}%`:"—"}</span>
                </div>
              ))}
              <div className="tj-version-item"><span className="tj-muted num">now</span><span>current version, used for this trade</span></div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function TradeModal({ trade, prefill, tags, instruments, plans, settings, activeAccount, allAttachments, onAddAttachment, onRemoveAttachment, onClose, onSave }) {
  const isEdit = !!trade?.id;
  const tradeId = useRef(trade?.id || uid()).current;
  const base = trade || prefill;
  const initialSymbol = base?.symbol || "";
  const initialInst = instruments.find((i) => i.symbol===initialSymbol);
  const [form, setForm] = useState(() => ({
    date: base?.date || todayStr(), symbol: initialSymbol, category: base?.category || initialInst?.category || "Forex",
    direction: base?.direction || "long", entry: base?.entry || "", exit: base?.exit || "", lots: base?.lots || "1",
    pointSize: base?.pointSize ?? initialInst?.pointSize ?? "", pointValue: base?.pointValue ?? initialInst?.pointValue ?? "",
    fees: base?.fees || "", risk: base?.risk || "", pnl: base?.pnl || "", tags: base?.tags || (base?.tag?[base.tag]:[]), session: base?.session || "",
    notes: base?.notes || "", planId: base?.planId || null, account_id: base?.account_id || null,
  }));
  const [isCustomSymbol, setIsCustomSymbol] = useState(!initialInst && !!initialSymbol);
  const [autoCalc, setAutoCalc] = useState(!isEdit);
  const [showSpecs, setShowSpecs] = useState(false);
  const [error, setError] = useState("");
  const [uploading, setUploading] = useState(false);
  const isNew = !trade;
  const tradeAttachments = allAttachments.filter((a) => a.owner_type==="trade" && a.owner_id===tradeId);
  const fileRef = useRef(null);

  function set(k,v) { setForm((f) => ({ ...f, [k]:v })); }
  function toggleTag(name) { setForm((f) => ({ ...f, tags: f.tags.includes(name) ? f.tags.filter((x) => x!==name) : [...f.tags, name] })); }
  function selectSymbol(sym, cat) {
    const inst = instruments.find((i) => i.symbol===sym);
    setForm((f) => ({ ...f, symbol:sym, category: cat||inst?.category||f.category, pointSize: inst?.pointSize ?? f.pointSize, pointValue: inst?.pointValue ?? f.pointValue }));
  }
  async function handleFiles(fileList) {
    setUploading(true);
    for (const file of Array.from(fileList)) await onAddAttachment("trade", tradeId, file);
    setUploading(false);
  }
  const calc = calcPnl({ entry:form.entry, exit:form.exit, lots:form.lots, direction:form.direction, fees:form.fees, pointSize:form.pointSize, pointValue:form.pointValue });

  function handleSave() {
    if (!form.date || !form.symbol.trim()) { setError("Date and symbol are required."); return; }
    if (isCustomSymbol && (!form.pointSize || !form.pointValue)) { setError("Enter a point size and point value for this custom instrument."); return; }
    const finalPnl = autoCalc ? (calc?calc.pnl:0) : (isNaN(parseFloat(form.pnl))?0:parseFloat(form.pnl));
    onSave({ ...form, id: tradeId, symbol: form.symbol.trim().toUpperCase(), pnl: finalPnl, pointSize: parseFloat(form.pointSize)||1, pointValue: parseFloat(form.pointValue)||1 });
  }
  function handleCancel() {
    if (isNew) tradeAttachments.forEach((a) => onRemoveAttachment(a.id));
    onClose();
  }

  return (
    <div className="tj-overlay" onClick={handleCancel}>
      <div className="tj-modal" onClick={(e) => e.stopPropagation()}>
        <h2>{isEdit?"Edit trade":"Add trade"}</h2>
        {(() => { const linkedPlanId = trade?.planId || prefill?.planId; const linkedPlan = linkedPlanId ? plans.find((p) => p.id===linkedPlanId) : null;
          return linkedPlan ? <PlanQuoteCard plan={linkedPlan} entry={form.entry} exit={form.exit} riskDollars={form.risk} accountSize={activeAccount?.account_size} tradeDate={form.date} showGap={settings.showPlanVsActualGap} /> : null; })()}
        {!trade?.planId && !prefill?.planId && <p className="tj-unplanned-note">No plan behind this trade.</p>}
        <div className="tj-form-grid">
          <label>Date<input className="tj-input" type="date" value={form.date} onChange={(e) => set("date", e.target.value)} /></label>
          <label className="tj-tag-select">Instrument
            {isCustomSymbol ? (
              <div className="tj-custom-symbol"><input className="tj-input" placeholder="Symbol e.g. USDZAR" value={form.symbol} onChange={(e) => set("symbol", e.target.value.toUpperCase())} /><button type="button" className="tj-link" onClick={() => { setIsCustomSymbol(false); set("symbol",""); }}>Choose from list</button></div>
            ) : (
              <InstrumentPicker instruments={instruments} symbol={form.symbol} category={form.category} onSelect={selectSymbol} onCustom={(cat) => { setIsCustomSymbol(true); set("symbol",""); set("category",cat); }} />
            )}
          </label>
          <label>Direction<select className="tj-input" value={form.direction} onChange={(e) => set("direction", e.target.value)}><option value="long">Long</option><option value="short">Short</option></select></label>
          <label>Session<select className="tj-input" value={form.session} onChange={(e) => set("session", e.target.value)}><option value="">—</option>{SESSIONS.map((s) => <option key={s} value={s}>{s}</option>)}</select></label>
          <label>Entry price<input className="tj-input" type="number" step="any" value={form.entry} onChange={(e) => set("entry", e.target.value)} /></label>
          <label>Exit price<input className="tj-input" type="number" step="any" value={form.exit} onChange={(e) => set("exit", e.target.value)} /></label>
          <label>Lots<input className="tj-input" type="number" step="any" value={form.lots} onChange={(e) => set("lots", e.target.value)} /></label>
          <label>Fees<input className="tj-input" type="number" step="any" value={form.fees} onChange={(e) => set("fees", e.target.value)} /></label>
          <label>Risk amount ($, optional)<input className="tj-input" type="number" step="any" value={form.risk} onChange={(e) => set("risk", e.target.value)} /></label>
        </div>
        <label className="tj-notes-label">Tags<TagMultiSelect tags={tags} selected={form.tags} onToggle={toggleTag} /></label>
        {!isCustomSymbol && form.symbol && (
          <div className="tj-specs-line"><span className="tj-muted num">Point size {form.pointSize} · Point value ${form.pointValue}/lot</span><button type="button" className="tj-link" onClick={() => setShowSpecs((s) => !s)}>{showSpecs?"Hide":"Adjust for this trade"}</button></div>
        )}
        {(isCustomSymbol || showSpecs) && (
          <div className="tj-specs-edit"><label>Point size<input className="tj-input" type="number" step="any" value={form.pointSize} onChange={(e) => set("pointSize", e.target.value)} /></label><label>Point value / lot ($)<input className="tj-input" type="number" step="any" value={form.pointValue} onChange={(e) => set("pointValue", e.target.value)} /></label></div>
        )}
        <div className="tj-pnl-row">
          <label className="tj-checkbox"><input type="checkbox" checked={autoCalc} onChange={(e) => setAutoCalc(e.target.checked)} />Calculate P&amp;L automatically</label>
          {autoCalc ? <span className={`num tj-pnl-preview ${calc?(calc.pnl>=0?"profit":"loss"):""}`}>{calc?`${calc.points>=0?"+":""}${calc.points.toFixed(1)} pts × $${parseFloat(form.pointValue).toFixed(2)} × ${form.lots} lot = ${fmtMoney(calc.pnl)}`:"Enter entry, exit, lots & point specs"}</span> : <input className="tj-input tj-pnl-input" type="number" step="any" placeholder="P&L ($)" value={form.pnl} onChange={(e) => set("pnl", e.target.value)} />}
        </div>
        <label className="tj-notes-label">Notes<textarea className="tj-input tj-textarea" rows={3} placeholder="Setup, what went right or wrong…" value={form.notes} onChange={(e) => set("notes", e.target.value)} /></label>
        <div className="tj-notes-label">
          <span>Trade screenshot or document</span>
          <div className="tj-attach-list">
            {tradeAttachments.map((a) => <AttachmentThumb key={a.id} att={a} onRemove={onRemoveAttachment} />)}
            <button type="button" className="tj-btn tj-btn-ghost" onClick={() => fileRef.current?.click()} disabled={uploading}>{uploading?"Uploading…":"+ Add file"}</button>
            <input ref={fileRef} type="file" accept="image/*,.pdf,.doc,.docx" multiple style={{ display:"none" }} onChange={(e) => { if (e.target.files.length) handleFiles(e.target.files); e.target.value=""; }} />
          </div>
        </div>
        {error && <p className="tj-error">{error}</p>}
        <div className="tj-modal-footer"><button className="tj-btn tj-btn-ghost" onClick={handleCancel}>Cancel</button><button className="tj-btn tj-btn-primary" onClick={handleSave}>{isEdit?"Save changes":"Add trade"}</button></div>
      </div>
    </div>
  );
}

/* ================= PLAN MODAL ================= */
function PlanModal({ plan, tags, instruments, settings, activeAccount, trades, onViewTrade, allAttachments, onAddAttachment, onRemoveAttachment, onClose, onSave }) {
  const planId = useRef(plan?.id || uid()).current;
  const locked = plan?.status === "Taken";
  const [form, setForm] = useState(() => plan ? { alertEnabled:false, alertTargetPrice:"", alertDirection:"above", ...plan, setupTags: plan.setupTags || (plan.setupType?[plan.setupType]:[]) } : {
    date: todayStr(), symbol:"", category:"Forex", direction:"Watching", session:"", setupTags:[],
    entryZone:"", stopLoss:"", takeProfit:"", riskPercent:"", thesis:"", status:"Watching",
    checklist: (settings.checklist||[]).map((c) => ({ criterion:c, status:null })),
    alertEnabled:false, alertTargetPrice:"", alertDirection:"above",
  });
  const initialInst = instruments.find((i) => i.symbol===(plan?.symbol||""));
  const [isCustomSymbol, setIsCustomSymbol] = useState(!!plan && !!plan.symbol && !initialInst);
  const [error, setError] = useState("");
  const [uploading, setUploading] = useState(false);
  const [showHistory, setShowHistory] = useState(false);
  const isNew = !plan;
  const planAttachments = allAttachments.filter((a) => a.owner_type==="plan" && a.owner_id===planId);
  const fileRef = useRef(null);
  const linkedTrade = locked && plan.linkedTradeId ? trades.find((t) => t.id===plan.linkedTradeId) : null;

  function set(k,v) { if (locked) return; setForm((f) => ({ ...f, [k]:v })); }
  function toggleSetupTag(name) { if (locked) return; setForm((f) => ({ ...f, setupTags: (f.setupTags||[]).includes(name) ? f.setupTags.filter((x) => x!==name) : [...(f.setupTags||[]), name] })); }
  function selectSymbol(sym, cat) { if (locked) return; set("symbol", sym); if (cat) set("category", cat); }
  function cycleCheck(i) {
    if (locked) return;
    setForm((f) => {
      const next = [...f.checklist];
      const cur = next[i].status;
      const nextStatus = cur===null ? "pass" : cur==="pass" ? "fail" : null;
      next[i] = { ...next[i], status: nextStatus };
      return { ...f, checklist: next };
    });
  }
  async function handleFiles(fileList) {
    setUploading(true);
    for (const file of Array.from(fileList)) await onAddAttachment("plan", planId, file);
    setUploading(false);
  }
  function handleSave() {
    if (!form.date || !form.symbol.trim()) { setError("Date and symbol are required."); return; }
    if (form.alertEnabled && isNaN(parseFloat(form.alertTargetPrice))) { setError("Enter a numeric price for the alert, or turn the alert off."); return; }
    onSave({ ...form, id: planId, symbol: form.symbol.trim().toUpperCase(), attachmentIds: planAttachments.map((a) => a.id) });
  }
  function handleCancel() {
    if (isNew) { planAttachments.forEach((a) => onRemoveAttachment(a.id)); }
    onClose();
  }

  // Suggested lot size from risk % + entry/stop, using this instrument's point specs and account size
  const inst = instruments.find((i) => i.symbol===form.symbol);
  const pointSize = inst?.pointSize;
  const pointValue = inst?.pointValue;
  const acctSize = parseFloat(activeAccount?.account_size);
  const entryNum = parseFloat(form.entryZone), slNum = parseFloat(form.stopLoss), riskPct = parseFloat(form.riskPercent);
  let suggestedLot = null, lotNote = "";
  if (isCustomSymbol) lotNote = "Pick a listed instrument to auto-suggest lot size.";
  else if (isNaN(acctSize) || acctSize<=0) lotNote = "Set this account's size in Setup to auto-suggest lot size.";
  else if (isNaN(entryNum) || isNaN(slNum)) lotNote = "Enter a numeric entry price and stop loss to auto-suggest lot size.";
  else if (isNaN(riskPct) || riskPct<=0) lotNote = "Enter risk % to auto-suggest lot size.";
  else if (!pointSize || !pointValue) lotNote = "This instrument has no point specs set.";
  else {
    const riskDollars = acctSize * riskPct / 100;
    const pointsAtRisk = Math.abs(entryNum - slNum) / pointSize;
    if (pointsAtRisk > 0) suggestedLot = riskDollars / (pointsAtRisk * pointValue);
  }

  return (
    <div className="tj-overlay" onClick={handleCancel}>
      <div className="tj-modal" onClick={(e) => e.stopPropagation()}>
        <h2>{locked ? "Plan (executed — locked)" : plan?"Edit plan":"Plan a trade"}</h2>
        {locked && (
          <div className="tj-locked-banner">
            <span>This plan was executed{plan.createdAt?` on ${fmtDate(plan.date)}`:""} and is now a permanent record — it can't be edited.</span>
            {linkedTrade && <button className="tj-btn tj-btn-primary" onClick={() => { onViewTrade(linkedTrade); onClose(); }}>View trade →</button>}
          </div>
        )}
        <fieldset disabled={locked} style={{ border:"none", padding:0, margin:0 }}>
        <div className="tj-form-grid">
          <label>Date<input className="tj-input" type="date" value={form.date} onChange={(e) => set("date", e.target.value)} /></label>
          <label className="tj-tag-select">Instrument
            {isCustomSymbol ? (
              <div className="tj-custom-symbol"><input className="tj-input" placeholder="Symbol e.g. USDZAR" value={form.symbol} onChange={(e) => set("symbol", e.target.value.toUpperCase())} /><button type="button" className="tj-link" onClick={() => { setIsCustomSymbol(false); set("symbol",""); }}>Choose from list</button></div>
            ) : (
              <InstrumentPicker instruments={instruments} symbol={form.symbol} category={form.category} onSelect={selectSymbol} onCustom={(cat) => { setIsCustomSymbol(true); set("symbol",""); set("category",cat); }} />
            )}
          </label>
          <label>Bias<select className="tj-input" value={form.direction} onChange={(e) => set("direction", e.target.value)}><option value="Watching">Watching (neutral)</option><option value="Long">Long</option><option value="Short">Short</option></select></label>
          <label>Session<select className="tj-input" value={form.session} onChange={(e) => set("session", e.target.value)}><option value="">—</option>{SESSIONS.map((s) => <option key={s} value={s}>{s}</option>)}</select></label>
          <label>Status<select className="tj-input" value={form.status} onChange={(e) => set("status", e.target.value)}>{PLAN_STATUSES.map((s) => <option key={s} value={s}>{s}</option>)}</select></label>
          <label>Entry price<input className="tj-input" type="number" step="any" placeholder="Numeric, e.g. 2415.00" value={form.entryZone} onChange={(e) => set("entryZone", e.target.value)} /></label>
          <label>Stop loss<input className="tj-input" type="number" step="any" value={form.stopLoss} onChange={(e) => set("stopLoss", e.target.value)} /></label>
          <label>Take profit<input className="tj-input" type="number" step="any" value={form.takeProfit} onChange={(e) => set("takeProfit", e.target.value)} /></label>
          <label>Risk (% of account)<input className="tj-input" type="number" step="any" value={form.riskPercent} onChange={(e) => set("riskPercent", e.target.value)} /></label>
        </div>
        <label className="tj-notes-label">Tags<TagMultiSelect tags={tags} selected={form.setupTags||[]} onToggle={toggleSetupTag} /></label>

        {!locked && (
          <div className="tj-lot-suggest">
            {suggestedLot!==null ? (
              <span className="num">Suggested lot size: <strong>{suggestedLot.toFixed(2)}</strong> (risking {fmtMoney(acctSize*riskPct/100)} across {Math.abs(entryNum-slNum)/pointSize} points)</span>
            ) : <span className="tj-muted">{lotNote}</span>}
          </div>
        )}

        {!locked && form.status==="Watching" && (
          <div className="tj-panel" style={{ margin:"14px 0", background:"var(--surface-2)" }}>
            <label className="tj-checkbox">
              <input type="checkbox" checked={!!form.alertEnabled} onChange={(e) => { const checked = e.target.checked; setForm((f) => ({ ...f, alertEnabled: checked, alertTargetPrice: checked && !f.alertTargetPrice && f.entryZone ? f.entryZone : f.alertTargetPrice })); }} />
              🔔 Set a price alert
            </label>
            {form.alertEnabled ? (
              <div style={{ marginTop:10, display:"flex", gap:10, alignItems:"center", flexWrap:"wrap" }}>
                <span className="tj-muted">Notify me when price is</span>
                <select className="tj-input" style={{ width:"auto", maxWidth:110 }} value={form.alertDirection} onChange={(e) => set("alertDirection", e.target.value)}>
                  <option value="above">at or above</option>
                  <option value="below">at or below</option>
                </select>
                <input className="tj-input" type="number" step="any" placeholder="e.g. 2415.00" style={{ width:"auto", maxWidth:140 }} value={form.alertTargetPrice} onChange={(e) => set("alertTargetPrice", e.target.value)} />
              </div>
            ) : (
              <p className="tj-muted" style={{ marginTop:6 }}>Pick any price — doesn't have to match your entry above.</p>
            )}
            <p className="tj-muted" style={{ marginTop:8, fontSize:12 }}>Alerts only run while this plan is in "Watching" status, and need notifications enabled on this device in Setup → Price alerts.</p>
          </div>
        )}

        <label className="tj-notes-label">Thesis — why this trade<textarea className="tj-input tj-textarea" rows={3} placeholder="What's the setup? What confirms it? What invalidates it?" value={form.thesis} onChange={(e) => set("thesis", e.target.value)} /></label>

        <div className="tj-notes-label">
          <span>Checklist</span>
          <div className="tj-checklist-edit">
            {(form.checklist||[]).length===0 && <span className="tj-muted">Add checklist items in Setup to use them here.</span>}
            {(form.checklist||[]).map((c,i) => (
              <div className="tj-checklist-row" key={i}>
                <span>{c.criterion}</span>
                <div className="tj-check-toggle">
                  <button type="button" className={`tj-check-btn pass ${c.status==="pass"?"active":""}`} onClick={() => cycleCheck(i)}>✓</button>
                  <button type="button" className={`tj-check-btn fail ${c.status==="fail"?"active":""}`} onClick={() => cycleCheck(i)}>✗</button>
                </div>
              </div>
            ))}
          </div>
        </div>

        <div className="tj-notes-label">
          <span>Trade idea — photo or document</span>
          <div className="tj-attach-list">
            {planAttachments.map((a) => <AttachmentThumb key={a.id} att={a} onRemove={locked?null:onRemoveAttachment} />)}
            {!locked && <button type="button" className="tj-btn tj-btn-ghost" onClick={() => fileRef.current?.click()} disabled={uploading}>{uploading?"Uploading…":"+ Add file"}</button>}
            <input ref={fileRef} type="file" accept="image/*,.pdf,.doc,.docx" multiple style={{ display:"none" }} onChange={(e) => { if (e.target.files.length) handleFiles(e.target.files); e.target.value=""; }} />
          </div>
        </div>
        </fieldset>

        {plan?.versionHistory?.length > 0 && (
          <div className="tj-notes-label">
            <button type="button" className="tj-link" onClick={() => setShowHistory((s) => !s)}>{showHistory?"Hide":"Show"} revision history ({plan.versionHistory.length})</button>
            {showHistory && (
              <div className="tj-version-list">
                {plan.versionHistory.map((v,i) => (
                  <div key={i} className="tj-version-item">
                    <span className="tj-muted num">{fmtDateTimeShort(v.savedAt)}</span>
                    <span>{v.snapshot.direction} · entry {v.snapshot.entryZone||"—"} · stop {v.snapshot.stopLoss||"—"} · target {v.snapshot.takeProfit||"—"} · risk {v.snapshot.riskPercent?`${v.snapshot.riskPercent}%`:"—"}{v.snapshot.thesis?` · "${v.snapshot.thesis.slice(0,50)}${v.snapshot.thesis.length>50?"…":""}"`:""}</span>
                  </div>
                ))}
                <div className="tj-version-item"><span className="tj-muted num">now</span><span>current version</span></div>
              </div>
            )}
          </div>
        )}

        {error && <p className="tj-error">{error}</p>}
        <div className="tj-modal-footer">
          <button className="tj-btn tj-btn-ghost" onClick={handleCancel}>{locked?"Close":"Cancel"}</button>
          {!locked && <button className="tj-btn tj-btn-primary" onClick={handleSave}>{plan?"Save changes":"Add to plan"}</button>}
        </div>
      </div>
    </div>
  );
}

function OnboardingModal({ onClose }) {
  const [step, setStep] = useState(0);
  const steps = [
    { title:"Welcome to your Trading Journal", body:"Quick tour — five things to know before you dive in. Takes about 30 seconds.", icon:"§" },
    { title:"Plan before you trade", body:"Plan & Journal is where it starts: write down your idea, run it through your checklist, set entry/stop/target and your risk % — the lot size calculates itself. Log the trade with one click once you take it.", icon:"📝" },
    { title:"Every trade, tracked", body:"Trade Log holds your full history. P&L is calculated automatically from the instrument's point value — no manual math. Add a screenshot or document to any trade.", icon:"📊" },
    { title:"See the shape of your trading", body:"Dashboard shows win rate, profit factor, and your equity curve. Calendar shows P&L by day and by week, so patterns jump out.", icon:"📈" },
    { title:"Get pinged when price arrives", body:"On any Watching plan, turn on \"🔔 Set a price alert\" and pick a price and direction — it doesn't have to be your entry. We'll watch the market and send a notification to your device the moment it's hit, even if the app is closed. Turn on notifications for your device once in Setup → Price alerts.", icon:"🔔" },
    { title:"Make it yours", body:"In Setup: create tags and a checklist that match your strategy, add trading accounts (Real, Demo, whatever you need), and adjust instrument specs if your broker's contract sizes differ.", icon:"⚙️" },
    { title:"You're set", body:"Tap the ? button in the header anytime to see this again. If you get stuck, the WhatsApp button in the corner reaches support directly.", icon:"✓" },
  ];
  const s = steps[step];
  const isLast = step === steps.length-1;
  return (
    <div className="tj-overlay" onClick={onClose}>
      <div className="tj-modal tj-modal-sm" onClick={(e) => e.stopPropagation()}>
        <div style={{ textAlign:"center", marginBottom:6 }}>
          <span className="tj-brand-mark" style={{ fontSize:34 }}>{s.icon}</span>
          <h2 style={{ marginTop:8 }}>{s.title}</h2>
        </div>
        <p style={{ fontSize:14, lineHeight:1.6, color:"var(--text-dim)", textAlign:"center" }}>{s.body}</p>
        <div className="tj-onboarding-dots">{steps.map((_,i) => <span key={i} className={i===step?"active":""} />)}</div>
        <div className="tj-modal-footer" style={{ justifyContent:"space-between" }}>
          <button className="tj-btn tj-btn-ghost" onClick={onClose}>Skip</button>
          <div style={{ display:"flex", gap:8 }}>
            {step>0 && <button className="tj-btn tj-btn-ghost" onClick={() => setStep((n) => n-1)}>Back</button>}
            <button className="tj-btn tj-btn-primary" onClick={() => isLast ? onClose() : setStep((n) => n+1)}>{isLast?"Let's go":"Next"}</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function ProfileModal({ profile, trades, stats, supabase, userId, onUpdate, onClose, onSignOut }) {
  const [username, setUsername] = useState(profile.username || "");
  const [saving, setSaving] = useState(false);
  const [uploadingAvatar, setUploadingAvatar] = useState(false);
  const [msg, setMsg] = useState("");
  const fileRef = useRef(null);

  const daysActive = new Set(trades.map((t) => t.date)).size;
  const isActiveSub = profile.subscription_status==="active" && profile.subscription_expires_at && new Date(profile.subscription_expires_at) > new Date();

  async function saveUsername() {
    setSaving(true);
    const { error } = await onUpdate({ username: username.trim() || null });
    setSaving(false);
    setMsg(error ? "Couldn't save — try a different username." : "Saved.");
    setTimeout(() => setMsg(""), 2000);
  }
  async function handleAvatarFile(file) {
    setUploadingAvatar(true);
    const resized = await resizeImageFile(file, 500);
    const uploaded = await sbUploadFile(supabase, userId, new File([resized], file.name, { type: resized.type||file.type }));
    if (uploaded) await onUpdate({ avatar_url: uploaded.publicUrl });
    setUploadingAvatar(false);
  }

  return (
    <div className="tj-overlay" onClick={onClose}>
      <div className="tj-modal tj-modal-sm" onClick={(e) => e.stopPropagation()}>
        <h2>Your profile</h2>
        <div className="tj-profile-header">
          <button className="tj-profile-avatar-big" onClick={() => fileRef.current?.click()} disabled={uploadingAvatar} title="Change profile picture">
            {profile.avatar_url ? <img src={profile.avatar_url} alt="" /> : <span>{(username||profile.email)[0].toUpperCase()}</span>}
            <span className="tj-profile-avatar-edit">{uploadingAvatar?"…":"✎"}</span>
          </button>
          <input ref={fileRef} type="file" accept="image/*" style={{ display:"none" }} onChange={(e) => { if (e.target.files[0]) handleAvatarFile(e.target.files[0]); e.target.value=""; }} />
          <div style={{ flex:1 }}>
            <div className="tj-tag-add" style={{ marginBottom:4 }}>
              <input className="tj-input" placeholder="Choose a username" value={username} onChange={(e) => setUsername(e.target.value)} style={{ flex:1 }} />
              <button className="tj-btn tj-btn-ghost" onClick={saveUsername} disabled={saving}>{saving?"Saving…":"Save"}</button>
            </div>
            <span className="tj-muted">{profile.email}{msg && <span style={{ marginLeft:8, color:"var(--gold)" }}>{msg}</span>}</span>
          </div>
        </div>

        <div className="tj-profile-stats">
          <div><span className="tj-muted">Member since</span><div className="num">{fmtDate((profile.created_at||"").slice(0,10))}</div></div>
          <div><span className="tj-muted">Days traded</span><div className="num">{daysActive}</div></div>
          <div><span className="tj-muted">{stats?.streakType?"Win streak":"Loss streak"}</span><div className={`num ${stats?stats.streakType?"profit":"loss":""}`}>{stats?stats.streak:0}</div></div>
          <div><span className="tj-muted">Win rate</span><div className="num">{stats?fmtPct(stats.winRate):"—"}</div></div>
          <div><span className="tj-muted">Net P&L</span><div className={`num ${stats && stats.netPnl>=0?"profit":stats?"loss":""}`}>{stats?fmtMoney(stats.netPnl):fmtMoney(0)}</div></div>
          <div><span className="tj-muted">Total trades</span><div className="num">{trades.length}</div></div>
        </div>

        <div style={{ marginTop:16, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
          <span className={`tj-status-pill ${isActiveSub?"status-taken":"status-watching"}`}>{isActiveSub?"Active subscriber":"On trial"}</span>
          <button className="tj-btn tj-btn-ghost" onClick={onSignOut}>Sign out</button>
        </div>
        <div className="tj-modal-footer"><button className="tj-btn tj-btn-primary" onClick={onClose}>Done</button></div>
      </div>
    </div>
  );
}

/* ================= AUTH / TRIAL GATE ================= */
function FullScreenMsg({ children }) {
  return <div className="tj-auth-wrap"><div className="tj-auth-box">{children}</div></div>;
}

function PasswordInput({ value, onChange, placeholder, onKeyDown, style }) {
  const [visible, setVisible] = useState(false);
  return (
    <div className="tj-password-wrap" style={style}>
      <input className="tj-input" type={visible ? "text" : "password"} placeholder={placeholder} value={value} onChange={onChange} onKeyDown={onKeyDown} />
      <button type="button" className="tj-password-toggle" onClick={() => setVisible((v) => !v)} title={visible ? "Hide password" : "Show password"} tabIndex={-1}>{visible ? "🙈" : "👁"}</button>
    </div>
  );
}

function AuthScreen({ mode, setMode, email, setEmail, password, setPassword, onSignIn, onSignUp, onForgot, pending, error }) {
  return (
    <div className="tj-auth-wrap">
      <div className="tj-auth-box">
        <span className="tj-brand-mark" style={{ display:"block", textAlign:"center" }}>§</span>
        <h1 style={{ textAlign:"center" }}>Trading Journal</h1>
        <p className="tj-auth-brand" style={{ textAlign:"center", marginBottom:20 }}>by Tanzanite Capital</p>

        {pending==="signup-confirm" ? (
          <div style={{ textAlign:"center" }}>
            <p>Check <strong>{email}</strong> to confirm your account.</p>
            <p className="tj-muted">Click the link in that email, then come back here and sign in with your password.</p>
            <button className="tj-btn tj-btn-ghost" style={{ marginTop:10 }} onClick={() => setMode("signin")}>Back to sign in</button>
          </div>
        ) : pending==="reset-sent" ? (
          <div style={{ textAlign:"center" }}>
            <p>Check <strong>{email}</strong> for a password reset link.</p>
            <button className="tj-btn tj-btn-ghost" style={{ marginTop:10 }} onClick={() => setMode("signin")}>Back to sign in</button>
          </div>
        ) : mode==="signup" ? (
          <React.Fragment>
            <p className="tj-muted" style={{ marginBottom:12 }}>Create an account to start your free 1-day trial.</p>
            <input className="tj-input" style={{ width:"100%", marginBottom:10 }} type="email" placeholder="you@email.com" value={email} onChange={(e) => setEmail(e.target.value)} />
            <PasswordInput style={{ marginBottom:10 }} placeholder="Create a password" value={password} onChange={(e) => setPassword(e.target.value)} onKeyDown={(e) => { if (e.key==="Enter") onSignUp(); }} />
            <button className="tj-btn tj-btn-primary" style={{ width:"100%", justifyContent:"center" }} onClick={onSignUp}>Create account</button>
            {error && <p className="tj-error" style={{ textAlign:"center" }}>{error}</p>}
            <p className="tj-muted" style={{ textAlign:"center", marginTop:14 }}>Already have an account? <button className="tj-link" onClick={() => setMode("signin")}>Sign in</button></p>
          </React.Fragment>
        ) : mode==="forgot" ? (
          <React.Fragment>
            <p className="tj-muted" style={{ marginBottom:12 }}>Enter your email and we'll send you a link to set a new password.</p>
            <input className="tj-input" style={{ width:"100%", marginBottom:10 }} type="email" placeholder="you@email.com" value={email} onChange={(e) => setEmail(e.target.value)} onKeyDown={(e) => { if (e.key==="Enter") onForgot(); }} />
            <button className="tj-btn tj-btn-primary" style={{ width:"100%", justifyContent:"center" }} onClick={onForgot}>Send reset link</button>
            {error && <p className="tj-error" style={{ textAlign:"center" }}>{error}</p>}
            <p className="tj-muted" style={{ textAlign:"center", marginTop:14 }}><button className="tj-link" onClick={() => setMode("signin")}>Back to sign in</button></p>
          </React.Fragment>
        ) : (
          <React.Fragment>
            <p className="tj-muted" style={{ marginBottom:12 }}>Sign in to your account.</p>
            <input className="tj-input" style={{ width:"100%", marginBottom:10 }} type="email" placeholder="you@email.com" value={email} onChange={(e) => setEmail(e.target.value)} />
            <PasswordInput style={{ marginBottom:10 }} placeholder="Password" value={password} onChange={(e) => setPassword(e.target.value)} onKeyDown={(e) => { if (e.key==="Enter") onSignIn(); }} />
            <button className="tj-btn tj-btn-primary" style={{ width:"100%", justifyContent:"center" }} onClick={onSignIn}>Sign in</button>
            {error && <p className="tj-error" style={{ textAlign:"center" }}>{error}</p>}
            <div style={{ display:"flex", justifyContent:"space-between", marginTop:14, fontSize:13 }}>
              <button className="tj-link" onClick={() => setMode("forgot")}>Forgot password?</button>
              <button className="tj-link" onClick={() => setMode("signup")}>Create an account</button>
            </div>
          </React.Fragment>
        )}
        <a className="tj-whatsapp-fab static" href={`https://wa.me/${WHATSAPP_NUMBER}`} target="_blank" rel="noreferrer">💬 Need help? WhatsApp us</a>
      </div>
    </div>
  );
}

function SetNewPasswordScreen({ onSubmit, error }) {
  const [pw, setPw] = useState(""); const [pw2, setPw2] = useState(""); const [localErr, setLocalErr] = useState("");
  async function submit() {
    if (pw.length < 6) { setLocalErr("Password must be at least 6 characters."); return; }
    if (pw !== pw2) { setLocalErr("Passwords don't match."); return; }
    setLocalErr("");
    await onSubmit(pw);
  }
  return (
    <div className="tj-auth-wrap">
      <div className="tj-auth-box">
        <span className="tj-brand-mark" style={{ display:"block", textAlign:"center" }}>§</span>
        <h1 style={{ textAlign:"center" }}>Set a new password</h1>
        <PasswordInput style={{ marginBottom:10 }} placeholder="New password" value={pw} onChange={(e) => setPw(e.target.value)} />
        <PasswordInput style={{ marginBottom:10 }} placeholder="Confirm new password" value={pw2} onChange={(e) => setPw2(e.target.value)} onKeyDown={(e) => { if (e.key==="Enter") submit(); }} />
        <button className="tj-btn tj-btn-primary" style={{ width:"100%", justifyContent:"center" }} onClick={submit}>Set password</button>
        {(localErr||error) && <p className="tj-error" style={{ textAlign:"center" }}>{localErr||error}</p>}
      </div>
    </div>
  );
}


function ExpiredScreen({ email }) {
  return (
    <div className="tj-auth-wrap">
      <div className="tj-auth-box">
        <span className="tj-brand-mark" style={{ display:"block", textAlign:"center" }}>§</span>
        <h1 style={{ textAlign:"center" }}>Your trial has ended</h1>
        <p className="tj-muted" style={{ textAlign:"center" }}>Signed in as {email}</p>
        <p style={{ textAlign:"center", margin:"18px 0 10px" }}>Choose a plan to keep your journal, plans, and journal history going:</p>
        <div className="tj-plan-options">
          {PLANS.map((p) => <div key={p.id} className="tj-plan-option"><span>{p.label}</span><span className="num">Tsh {p.price.toLocaleString()}</span></div>)}
        </div>
        <a className="tj-btn tj-btn-primary" style={{ width:"100%", justifyContent:"center", marginTop:14 }} href={`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent("Hi, I'd like to subscribe to the Trading Journal ("+email+")")}`} target="_blank" rel="noreferrer">💬 Subscribe via WhatsApp</a>
      </div>
    </div>
  );
}

function TrialBanner({ remainingMs }) {
  const totalSec = Math.max(0, Math.floor(remainingMs/1000));
  const h = String(Math.floor(totalSec/3600)).padStart(2,"0");
  const m = String(Math.floor((totalSec%3600)/60)).padStart(2,"0");
  const s = String(totalSec%60).padStart(2,"0");
  return <div className="tj-trial-banner">Free trial — <span className="num">{h}:{m}:{s}</span> remaining</div>;
}

function ThemeToggle({ inline }) {
  const [theme, setTheme] = useState(() => localStorage.getItem("tj_theme") || "dark");
  useEffect(() => { document.documentElement.setAttribute("data-theme", theme); localStorage.setItem("tj_theme", theme); }, [theme]);
  if (inline) return <button className="tj-btn tj-btn-ghost" onClick={() => setTheme((t) => t==="dark"?"light":"dark")}>{theme==="dark"?"☀️ Light mode":"🌙 Dark mode"}</button>;
  return <button className="tj-theme-toggle" onClick={() => setTheme((t) => t==="dark"?"light":"dark")} title="Toggle light/dark mode">{theme==="dark"?"☀️":"🌙"}</button>;
}

function RootApp() {
  const supabase = useMemo(() => window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY), []);
  const [session, setSession] = useState(null);
  const [authChecked, setAuthChecked] = useState(false);
  const [profile, setProfile] = useState(null);
  const [profileLoading, setProfileLoading] = useState(false);
  const [profileError, setProfileError] = useState("");
  const [emailInput, setEmailInput] = useState("");
  const [passwordInput, setPasswordInput] = useState("");
  const [authMode, setAuthMode] = useState("signin");
  const [authPending, setAuthPending] = useState("");
  const [isPasswordRecovery, setIsPasswordRecovery] = useState(false);
  const [authError, setAuthError] = useState("");
  const [now, setNow] = useState(Date.now());

  useEffect(() => {
    const refCode = new URLSearchParams(window.location.search).get("ref");
    if (refCode) localStorage.setItem("tj_ref_code", refCode);
    supabase.auth.getSession().then(({ data }) => { setSession(data.session); setAuthChecked(true); });
    const { data: listener } = supabase.auth.onAuthStateChange((event, sess) => {
      if (event === "TOKEN_REFRESHED") return; // background token refresh — same user, not a real auth change
      if (event === "PASSWORD_RECOVERY") setIsPasswordRecovery(true);
      setSession(sess);
    });
    return () => listener.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (!session) { setProfile(null); return; }
    let cancelled = false;
    (async () => {
      if (!profile) setProfileLoading(true); // only show the loading screen on the very first fetch
      setProfileError("");
      try {
        let { data: existing, error: selErr } = await supabase.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
        if (selErr) throw selErr;
        if (!existing) {
          const referral_code = Math.random().toString(36).slice(2,8).toUpperCase();
          const refBy = localStorage.getItem("tj_ref_code");
          const { data: created, error: insErr } = await supabase.from("profiles").insert({ id: session.user.id, email: session.user.email, referral_code, referred_by: refBy || null }).select().single();
          if (insErr) throw insErr;
          existing = created;
        }
        if (!cancelled) setProfile(existing);
      } catch (e) {
        console.error("Profile load failed:", e);
        if (!cancelled) setProfileError(e?.message || "Something went wrong loading your account.");
      }
      if (!cancelled) setProfileLoading(false);
    })();
    return () => { cancelled = true; };
  }, [session?.user?.id]);

  useEffect(() => { const t = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(t); }, []);

  async function handleSignIn() {
    setAuthError("");
    if (!emailInput.trim() || !passwordInput) { setAuthError("Enter your email and password."); return; }
    const { error } = await supabase.auth.signInWithPassword({ email: emailInput.trim(), password: passwordInput });
    if (error) setAuthError(error.message);
  }
  async function handleSignUp() {
    setAuthError("");
    if (!emailInput.trim() || !passwordInput) { setAuthError("Enter your email and a password."); return; }
    if (passwordInput.length < 6) { setAuthError("Password must be at least 6 characters."); return; }
    const { data, error } = await supabase.auth.signUp({ email: emailInput.trim(), password: passwordInput, options: { emailRedirectTo: window.location.href.split("?")[0] } });
    if (error) { setAuthError(error.message); return; }
    if (!data.session) setAuthPending("signup-confirm");
  }
  async function handleForgotPassword() {
    setAuthError("");
    if (!emailInput.trim()) { setAuthError("Enter your email."); return; }
    const { error } = await supabase.auth.resetPasswordForEmail(emailInput.trim(), { redirectTo: window.location.href.split("?")[0] });
    if (error) setAuthError(error.message); else setAuthPending("reset-sent");
  }
  async function handleSetNewPassword(newPassword) {
    setAuthError("");
    const { error } = await supabase.auth.updateUser({ password: newPassword });
    if (error) { setAuthError(error.message); return; }
    setIsPasswordRecovery(false);
  }
  async function signOut() { await supabase.auth.signOut(); setSession(null); setProfile(null); }

  if (!authChecked) return <React.Fragment><ThemeToggle /><FullScreenMsg><p className="tj-muted">Loading…</p></FullScreenMsg></React.Fragment>;
  if (isPasswordRecovery) return <React.Fragment><ThemeToggle /><SetNewPasswordScreen onSubmit={handleSetNewPassword} error={authError} /></React.Fragment>;
  if (!session) return <React.Fragment><ThemeToggle /><AuthScreen mode={authMode} setMode={(m) => { setAuthMode(m); setAuthPending(""); setAuthError(""); }} email={emailInput} setEmail={setEmailInput} password={passwordInput} setPassword={setPasswordInput} onSignIn={handleSignIn} onSignUp={handleSignUp} onForgot={handleForgotPassword} pending={authPending} error={authError} /></React.Fragment>;
  if (profileError && !profile) return (
    <React.Fragment>
      <ThemeToggle />
      <FullScreenMsg>
        <p className="tj-error" style={{ marginBottom:14 }}>Couldn't load your account: {profileError}</p>
        <button className="tj-btn tj-btn-primary" style={{ width:"100%", justifyContent:"center", marginBottom:8 }} onClick={() => window.location.reload()}>Try again</button>
        <button className="tj-btn tj-btn-ghost" style={{ width:"100%", justifyContent:"center" }} onClick={signOut}>Sign out</button>
      </FullScreenMsg>
    </React.Fragment>
  );
  if (profileLoading || !profile) return <React.Fragment><ThemeToggle /><FullScreenMsg><p className="tj-muted">Setting up your account…</p></FullScreenMsg></React.Fragment>;


  const trialEndMs = new Date(profile.trial_end).getTime();
  const subExpiresMs = profile.subscription_expires_at ? new Date(profile.subscription_expires_at).getTime() : null;
  const isActiveSub = profile.subscription_status === "active" && subExpiresMs && subExpiresMs > now;
  const inTrial = !isActiveSub && trialEndMs > now;
  const expired = !isActiveSub && !inTrial;

  if (expired) return <React.Fragment><ThemeToggle /><ExpiredScreen email={profile.email} /></React.Fragment>;

  return (
    <div>
      {inTrial && <TrialBanner remainingMs={trialEndMs - now} />}
      <TradingJournal supabase={supabase} userId={session.user.id} profile={profile} onSignOut={signOut} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<RootApp />);
</script>
</body>
</html>
